# 글그린 Nginx 설정(093 무중단 배포). 서버의 ~/nginx/geulgreen.java21.net.conf를 이 내용으로 바꾸고 nginx -t 후 reload.
# 앱 두 대(8300, 8301)를 upstream으로 묶어, 배포 중 한 대가 꺼져 있으면 다른 대로 보낸다(run-on-server.sh가 한 대씩 교체).
# 공용 Nginx라 map 변수·upstream 이름에 geulgreen_을 붙여 다른 팀 설정과 겹치지 않게 한다.

# WebSocket일 때만 Connection: upgrade, 평소에는 비워서 upstream keepalive를 쓴다
map $http_upgrade $geulgreen_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream geulgreen_java21_net {
    # 한 번 실패하면 10초 동안 빼 둔다(배포 중 꺼진 대를 빨리 피함)
    server 127.0.0.1:8300 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8301 max_fails=1 fail_timeout=10s;
    keepalive 16;
}

server {
    server_name geulgreen.java21.net;

    access_log /home/aiot3/AIGJ_01_001/nginx/logs/geulgreen.java21.net.access.log;
    error_log  /home/aiot3/AIGJ_01_001/nginx/logs/geulgreen.java21.net.error.log;

    client_max_body_size 20M;

    location / {
        proxy_pass http://geulgreen_java21_net;

        # 한 대가 꺼져 있으면 다른 대로 한 번만 다시 보낸다(POST는 앱에 닿기 전 실패일 때만 다시 보냄, Nginx 기본)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        proxy_connect_timeout 3s;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $geulgreen_connection_upgrade;

        proxy_read_timeout 60s;
    }

    # HSTS·nosniff는 앱(Spring Security)이 이미 보내므로 여기서 또 붙이지 않는다(겹치면 헤더가 두 번 나감)

    # 서버 Nginx가 1.18.0이라 HTTP/2는 listen에 붙인다(1.25.1 이상으로 올라가면 "listen 443 ssl;" + "http2 on;"으로)
    listen 443 ssl http2;
    ssl_certificate     /etc/letsencrypt/live/geulgreen.java21.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geulgreen.java21.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = geulgreen.java21.net) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name geulgreen.java21.net;
    return 404;
}
