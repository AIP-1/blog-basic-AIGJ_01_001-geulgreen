# CodeRabbit 자동 코드 리뷰(GitHub App). 리뷰는 참고용이고 필수 검사가 아니라 머지를 막지 않는다.
language: ko-KR
reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["develop", "main"]
  path_filters:
    - "!**/build/**"
    - "!gradle/wrapper/**"
    - "!gradlew"
    - "!gradlew.bat"
    - "!design-handoff/**"
