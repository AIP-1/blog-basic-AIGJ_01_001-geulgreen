# 학교 공용 서버 배포(서버 배포 설명서 10-08). 깃플로우(1.14.0~): develop·main으로 가는 PR은 테스트만,
# main에 머지되면 테스트 → 이미지 생성 → SSH로 서버에 보내 실행(새 버전이 안 켜지면 전 버전으로 되돌림, 1.15.0).
# 이 저장소(practicech/blog)에서만 돈다. 과제 제출 사본(AIP-1)에서는 아래 if로 건너뛴다.
# 필요한 Repository secrets: SSH_ADDRESS SSH_PORT SSH_ID SSH_PASSWORD, DB_ADDRESS DB_PORT DB_NAME DB_USERNAME DB_PASSWORD DB_SCHEMA,
#   APP_PORT APP_DOMAIN, MAIL_USERNAME MAIL_PASSWORD, GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET, GH_CLIENT_ID GH_CLIENT_SECRET,
#   (선택) GEMINI_API_KEY, ADMIN_EMAILS(관리자로 지정할 이메일, 쉼표로 여러 개),
#   TELEGRAM_BOT_TOKEN(096 텔레그램 알림), TELEGRAM_CHAT_ID(배포 결과를 받을 채팅 번호, 봇 연결 메시지에 나옴)
name: deploy

on:
  push:
    branches: [main]
  # 깃플로우: develop·release/*·hotfix/*로 가는 PR은 테스트만 돌린다(배포는 main에 머지될 때만)
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "테스트 건너뛰기(급할 때만)"
        type: boolean
        default: false

concurrency:
  # 배포는 한 번에 하나씩, PR 테스트는 PR마다 따로
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: false

jobs:
  test:
    # 소스 레포에서만 돈다(같은 내용을 받는 문서 레포 AIPKANG/docs에서는 건너뜀)
    if: ${{ github.repository == 'practicech/blog' && (github.event_name != 'workflow_dispatch' || !inputs.skip_tests) }}
    runs-on: ubuntu-24.04  # ubuntu-latest는 2026-10-19부터 26으로 바뀜, 검증 전까지 고정
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: 테스트(Testcontainers가 PostgreSQL·Redis·Mailpit·MinIO를 띄움)
        run: ./gradlew --no-daemon test
      - name: 실패한 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test

  deploy:
    needs: test
    if: ${{ always() && github.repository == 'practicech/blog' && github.event_name != 'pull_request' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-24.04  # ubuntu-latest는 2026-10-19부터 26으로 바뀜, 검증 전까지 고정
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 도커 이미지 만들기
        run: |
          docker build -t team-blog:latest .
          docker save team-blog:latest | gzip > image.tar.gz
          ls -lh image.tar.gz

      - name: 서버로 이미지·스크립트 보내기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "image.tar.gz,deploy/school/run-on-server.sh"
          target: "~/team-blog"
          strip_components: 0
          overwrite: true

      - name: 서버에서 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 15m
          envs: APP_PORT,APP_DOMAIN,DB_ADDRESS,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,DB_SCHEMA,MAIL_USERNAME,MAIL_PASSWORD,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GITHUB_CLIENT_ID,GITHUB_CLIENT_SECRET,GEMINI_API_KEY,ADMIN_EMAILS,TELEGRAM_BOT_TOKEN
          script: |
            mv ~/team-blog/deploy/school/run-on-server.sh ~/team-blog/run-on-server.sh
            chmod 700 ~/team-blog/run-on-server.sh
            ~/team-blog/run-on-server.sh

      # 096 강성찬 개인 확장: 앱이 아니라 여기서 보낸다(배포가 실패해 앱이 꺼져 있어도 알림이 가게). 비밀값이 없으면 건너뛴다
      - name: 배포 결과 텔레그램 알림
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ job.status }}
          TITLE: ${{ github.event.head_commit.message || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then echo "텔레그램 비밀값 없음: 알림 건너뜀"; exit 0; fi
          if [ "${RESULT}" = "success" ]; then head="✅ 배포 성공"; else head="❌ 배포 실패(${RESULT})"; fi
          text="$(printf '%s: %s\n%s' "${head}" "${TITLE%%$'\n'*}" "${RUN_URL}")"
          # 토큰은 curl 인자가 아니라 표준 입력 설정으로 넘긴다(run-on-server.sh의 점검 줄과 같은 방식)
          printf 'url = "https://api.telegram.org/bot%s/sendMessage"\n' "${TELEGRAM_BOT_TOKEN}" \
            | curl -s -o /dev/null -w '텔레그램 응답: %{http_code}\n' -m 10 --config - \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" || true
