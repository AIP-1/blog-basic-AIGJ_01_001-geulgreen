<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>문의하기</title>
</head>
<body>
<!-- 090 강성찬 개인 확장: 사이트 안 문의 양식(스크립트 없는 폼) -->
<main class="settings">
    <h1>문의하기</h1>
    <p class="help">궁금한 점, 고장 난 곳, 바라는 기능을 알려 주세요. 관리자가 읽고 적어 주신 이메일로 답장해요.</p>
    <p th:if="${error != null}" class="form-error" role="alert" data-toast th:text="${error}">오류</p>
    <form method="post" action="/contact">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="field">
            <label for="contact-kind">문의 종류</label>
            <select id="contact-kind" name="kind" required>
                <option value="" th:selected="${kind == null}">골라 주세요</option>
                <option th:each="k : ${kinds}" th:value="${k[0]}" th:text="${k[1]}" th:selected="${k[0] == kind}">종류</option>
            </select>
        </div>
        <div class="field">
            <label for="contact-title">제목</label>
            <input id="contact-title" name="title" type="text" required th:maxlength="${titleMax}" th:value="${formTitle}">
        </div>
        <div class="field">
            <label for="contact-content">내용</label>
            <textarea id="contact-content" name="content" required th:maxlength="${contentMax}" th:text="${formContent}"></textarea>
        </div>
        <div class="field">
            <label for="contact-email">답장 받을 이메일</label>
            <input id="contact-email" name="email" type="email" maxlength="254" autocomplete="email" aria-describedby="contact-email-help"
                   th:value="${email}" th:readonly="${memberEmail != null}" th:required="${memberEmail == null}"
                   th:classappend="${memberEmail != null} ? 'readonly'">
            <p id="contact-email-help" class="help">답장을 보낼 때만 써요.</p>
        </div>
        <button type="submit" class="btn btn-primary">보내기</button>
    </form>
</main>
</body>
</html>
