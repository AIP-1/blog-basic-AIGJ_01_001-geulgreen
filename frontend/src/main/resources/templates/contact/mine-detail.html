<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${inquiry.title()}">내 문의</title>
</head>
<body>
<!-- 099 강성찬 개인 확장: 내 문의 하나(보낸 내용과 관리자 답장) -->
<main class="settings">
    <h1>문의하기</h1>
    <nav th:replace="~{contact/tabs :: tabs('mine')}"></nav>
    <h2 th:text="${inquiry.title()}">제목</h2>
    <p>
        <span class="badge" th:text="${inquiry.done()} ? '답변 완료' : '답변 대기'">답변 대기</span>
        <span class="badge" th:text="${inquiry.kindLabel()}">종류</span>
        <span class="help" th:text="${T(com.team.blog.shared.web.KoreanDateFormatter).dateTime(inquiry.createdAt())}">시각</span>
    </p>
    <p class="snapshot" th:text="${inquiry.content()}">내용</p>
    <section aria-labelledby="mine-reply">
        <h2 id="mine-reply">답장</h2>
        <th:block th:if="${inquiry.done()}">
            <p class="help" th:if="${inquiry.repliedAt() != null}" th:text="${T(com.team.blog.shared.web.KoreanDateFormatter).dateTime(inquiry.repliedAt())}">시각</p>
            <p class="snapshot" th:text="${inquiry.reply()}">답장</p>
        </th:block>
        <p th:unless="${inquiry.done()}" class="help">아직 답장이 없어요. 답장이 오면 알림과 메일로 알려 드려요.</p>
    </section>
    <p><a href="/contact/mine">내 문의 목록으로</a></p>
</main>
</body>
</html>
