<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${board.club().name() + ' · 함께 쓰기 · 글그린'}">함께 쓰기 · 글그린</title>
</head>
<body>
<main class="list-page mission-page">
    <!-- 111 강성찬 개인 확장: 함께 쓰기 화면(멤버만). 위쪽(정보·진행표·초대)은 좁게 가운데, 멤버들의 글만 넓게 -->
    <nav th:replace="~{mission/today :: missionTabs('clubs')}"></nav>
    <p th:if="${clubNotice != null}" class="notice" role="status" data-toast="success" th:text="${clubNotice}">알림</p>
    <p th:if="${clubError != null}" class="notice" role="alert" data-toast="error" th:text="${clubError}">오류</p>
    <div class="club-top" th:with="c=${board.club()}, p=${board.period()}, allDone=${!board.members().isEmpty() and wroteCount == board.members().size()}">
        <section class="mission-panel club-head" aria-labelledby="club-heading">
            <h1 id="club-heading" th:text="${c.name()}">함께 쓰기</h1>
            <p th:if="${!c.intro().isEmpty()}" class="club-intro" th:text="${c.intro()}">소개</p>
            <p class="help club-meta"><th:block th:replace="~{fragments/meta :: parts(${c.everyDays() + '일에 1편 · ' + #temporals.format(c.startDate(), 'M월 d일') + ' ~ '
                    + #temporals.format(c.endDate(), 'M월 d일') + ' · 멤버 ' + board.members().size() + '/' + c.memberCap() + '명 · ' + c.modeLabel()})}"></th:block></p>
            <div class="club-period">
                <p class="club-period-row">
                    <strong th:text="${board.ended() ? '마지막 기간' : board.notStarted() ? '첫 기간' : '이번 기간'}">이번 기간</strong>
                    <span class="help"><th:block th:replace="~{fragments/meta :: parts(${p.index() + '/' + p.total() + '번째 · ' + #temporals.format(p.start(), 'M월 d일') + ' ~ '
                            + (p.start().getMonthValue() == p.end().getMonthValue() ? #temporals.format(p.end(), 'd일') : #temporals.format(p.end(), 'M월 d일'))})}"></th:block></span>
                    <span class="club-count" th:classappend="${allDone} ? 'is-done'"><th:block th:if="${allDone}"><th:block
                            th:replace="~{fragments/icons :: check}"></th:block></th:block><span th:text="${c.showsRatio() ? wroteCount + '/' + board.members().size() + '명 썼어요' : '이번 기간 ' + wroteCount + '명이 썼어요'}">0명</span></span>
                </p>
                <!-- 누구나 바로 들어오는 방은 커지면 비율이 낮아 보여 막대 없이 쓴 사람 수만(ClubService.Club#showsRatio) -->
                <div th:if="${c.showsRatio()}" class="club-progress" role="progressbar" aria-label="이번 기간에 쓴 멤버" aria-valuemin="0"
                     th:attr="aria-valuemax=${board.members().size()},aria-valuenow=${wroteCount}">
                    <span th:style="'width:' + ${board.members().isEmpty() ? 0 : wroteCount * 100 / board.members().size()} + '%'"></span></div>
                <p th:if="${board.notStarted()}" class="help">아직 함께 쓰기가 시작되지 않았어요. 시작 날짜부터 세요</p>
                <p th:if="${board.ended()}" class="help">함께 쓰기가 끝났어요. 마지막 기간의 기록이에요</p>
            </div>
            <!-- 사람이 많으면(9명부터) 처음엔 접어 둔다. 스크립트 없이 details -->
            <details class="club-members" th:open="${board.members().size() <= 8}">
            <summary><span th:text="${'멤버 ' + board.members().size() + '명'}">멤버</span><th:block th:replace="~{fragments/icons :: chevron}"></th:block></summary>
            <ul class="club-board" aria-label="멤버">
                <li th:each="m : ${board.members()}">
                    <a th:href="${paths.blog(m.handle())}" class="club-member">
                        <th:block th:replace="~{fragments/avatar :: avatar(${m.avatar()}, 32)}"></th:block>
                        <span class="club-member-text"><span class="club-member-name"><span th:text="${m.name()}">이름</span><span
                                th:if="${m.owner()}" class="badge">만든 사람</span></span><span class="help" th:text="${m.handle()}">아이디</span></span></a>
                    <span class="club-state" th:classappend="${m.wrote()} ? 'is-done'"><th:block th:if="${m.wrote()}"><th:block
                            th:replace="~{fragments/icons :: check}"></th:block>썼어요</th:block><th:block th:unless="${m.wrote()}">아직이에요</th:block></span>
                    <form th:if="${board.isOwner() and !m.owner()}" class="inline-form" method="post"
                          th:action="@{/missions/clubs/{id}/members/{mid}/remove(id=${c.id()},mid=${m.memberId()})}"
                          th:attr="data-confirm=${m.name() + ' 님을 함께 쓰기에서 내보낼까요?'}">
                        <button type="submit" class="btn-text club-remove">내보내기</button>
                    </form>
                </li>
            </ul>
            </details>
        </section>
        <!-- 111 후속: 만든 사람만 — 참여 요청 승인·거절, 방 종류·정원 -->
        <section th:if="${board.isOwner()}" class="mission-panel club-owner" aria-labelledby="club-owner-heading">
            <h2 id="club-owner-heading">방 관리</h2>
            <th:block th:if="${!requests.isEmpty()}">
                <h3 class="club-sub" th:text="${'참여 요청 ' + requests.size() + '명'}">참여 요청</h3>
                <ul class="club-board club-requests">
                    <li th:each="r : ${requests}">
                        <a th:href="${paths.blog(r.handle())}" class="club-member">
                            <th:block th:replace="~{fragments/avatar :: avatar(${r.avatar()}, 32)}"></th:block>
                            <span class="club-member-text"><span class="club-member-name" th:text="${r.name()}">이름</span><span class="help" th:text="${r.handle()}">아이디</span></span></a>
                        <form class="inline-form" method="post" th:action="@{/missions/clubs/{id}/requests/{mid}/reject(id=${c.id()},mid=${r.memberId()})}">
                            <button type="submit" class="btn-text club-remove">거절</button></form>
                        <form class="inline-form" method="post" th:action="@{/missions/clubs/{id}/requests/{mid}/approve(id=${c.id()},mid=${r.memberId()})}">
                            <button type="submit" class="btn btn-primary btn-sm">승인</button></form>
                    </li>
                </ul>
            </th:block>
            <form method="post" th:action="@{/missions/clubs/{id}/settings(id=${c.id()})}" class="club-form club-settings">
                <fieldset class="club-modes">
                    <legend>방 종류</legend>
                    <th:block th:each="mode : ${modes}"><label th:replace="~{mission/clubs :: modeOption(${mode}, ${c.joinMode()})}"></label></th:block>
                </fieldset>
                <div class="club-form-row">
                    <label for="club-cap">정원</label>
                    <span class="club-inline"><input id="club-cap" name="memberCap" type="number" min="2" max="100" required th:value="${c.memberCap()}"> 명까지</span>
                </div>
                <div class="club-form-actions"><button type="submit" class="btn btn-sm">저장</button></div>
            </form>
        </section>
        <section class="mission-panel club-invite-card" aria-labelledby="club-invite-heading" th:if="${!board.ended()}">
            <h2 id="club-invite-heading">친구 초대하기</h2>
            <p class="help" th:text="${'나를 팔로우하는 사람과 친한 친구에게 초대를 보내요. 받은 사람이 수락하면 바로 들어와요 · 오늘 ' + invitesLeft + '명 더 보낼 수 있어요'}">설명</p>
            <form th:if="${!candidates.isEmpty()}" method="post" th:action="@{/missions/clubs/{id}/invite(id=${c.id()})}" class="club-picker">
                <details class="club-members">
                    <summary><span th:text="${'초대할 사람 고르기 · ' + candidates.size() + '명'}">고르기</span><th:block th:replace="~{fragments/icons :: chevron}"></th:block></summary>
                    <ul class="club-board">
                        <li th:each="p : ${candidates}"><label class="club-member">
                            <input type="checkbox" name="memberIds" th:value="${p.memberId()}">
                            <th:block th:replace="~{fragments/avatar :: avatar(${p.avatar()}, 32)}"></th:block>
                            <span class="club-member-text"><span class="club-member-name"><span th:text="${p.name()}">이름</span><span
                                    th:if="${p.mutual()}" class="badge">서로 팔로우</span></span><span class="help" th:text="${p.handle()}">아이디</span></span></label></li>
                    </ul>
                    <div class="club-form-actions"><button type="submit" class="btn btn-primary btn-sm">초대 보내기</button></div>
                </details>
            </form>
            <p th:if="${candidates.isEmpty()}" class="help">초대할 수 있는 팔로워·친한 친구가 없어요. 아래 링크를 보내 주세요</p>
            <p class="help club-link-lead">링크를 받은 사람은 방 종류와 상관없이 바로 들어올 수 있어요</p>
            <button type="button" id="club-invite-copy" class="btn btn-sm" hidden
                    th:attr="data-invite-url=${siteOrigin + '/missions/clubs/join/' + c.inviteCode()}"><th:block
                    th:replace="~{fragments/icons :: link}"></th:block>초대 링크 복사</button>
            <p class="help club-invite-url" th:text="${siteOrigin + '/missions/clubs/join/' + c.inviteCode()}">주소</p>
        </section>
    </div>
    <section class="mission-feed" aria-labelledby="club-posts-heading">
        <h2 id="club-posts-heading"><th:block th:replace="~{fragments/icons :: pen}"></th:block>멤버들이 쓴 글</h2>
        <p th:if="${cards.isEmpty()}" class="empty-state">아직 기간에 올라온 글이 없어요</p>
        <ul class="card-grid home-cards mission-posts">
            <li th:each="card : ${cards}" class="mission-card"><article th:replace="~{fragments/post-card :: card(${card}, ${cardDates.get(card.id())}, true)}"></article></li>
        </ul>
    </section>
    <section class="club-actions">
        <form th:if="${!board.isOwner()}" method="post" th:action="@{/missions/clubs/{id}/leave(id=${board.club().id()})}"
              data-confirm="함께 쓰기에서 나갈까요? 다시 들어오려면 초대 링크가 필요해요.">
            <button type="submit" class="btn btn-sm">함께 쓰기에서 나가기</button>
        </form>
        <form th:if="${board.isOwner()}" method="post" th:action="@{/missions/clubs/{id}/delete(id=${board.club().id()})}"
              data-confirm="함께 쓰기를 지울까요? 멤버들의 글은 그대로 남아요. 되돌릴 수 없어요.">
            <button type="submit" class="btn btn-sm btn-danger">함께 쓰기 삭제</button>
        </form>
    </section>
    <script th:src="@{/js/mission/club.js}" defer></script>
</main>
</body>
</html>
