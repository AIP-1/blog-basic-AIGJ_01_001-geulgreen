<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>모임 초대 · 글그린</title>
</head>
<body>
<main class="list-page mission-page">
    <!-- 111 후보: 초대 링크로 연 화면. [참여하기]를 눌러야 들어간다 -->
    <section class="mission-panel club-join" aria-labelledby="club-join-heading">
        <p class="mission-eyebrow">모임 초대</p>
        <h1 id="club-join-heading" th:text="${club.name()}">모임</h1>
        <p th:if="${!club.intro().isEmpty()}" th:text="${club.intro()}">소개</p>
        <p class="help" th:text="${club.everyDays() + '일에 1편 · ' + club.memberCount() + '명 · ' + #temporals.format(club.startDate(), 'M월 d일') + ' ~ ' + #temporals.format(club.endDate(), 'M월 d일')}">규칙</p>
        <form method="post" th:action="@{/missions/clubs/join/{code}(code=${club.inviteCode()})}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-primary">참여하기</button>
        </form>
    </section>
</main>
</body>
</html>
