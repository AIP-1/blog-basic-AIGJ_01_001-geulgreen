<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>함께 쓰기 초대 · 글그린</title>
</head>
<body>
<main class="list-page mission-page">
    <!-- 111 후보: 초대 링크로 연 화면. [참여하기]를 눌러야 들어간다 -->
    <div class="club-top">
    <section class="mission-panel club-join" aria-labelledby="club-join-heading">
        <p class="mission-eyebrow">함께 쓰기 초대</p>
        <h1 id="club-join-heading" th:text="${club.name()}">함께 쓰기</h1>
        <p th:if="${!club.intro().isEmpty()}" th:text="${club.intro()}">소개</p>
        <p class="help"><th:block th:replace="~{fragments/meta :: parts(${club.everyDays() + '일에 1편 · ' + club.memberCount() + '명 · ' + #temporals.format(club.startDate(), 'M월 d일') + ' ~ ' + #temporals.format(club.endDate(), 'M월 d일')})}"></th:block></p>
        <p th:if="${club.joinMode() == 'APPROVAL'}" class="help">승인 후 참여 방이에요. 관리자가 승인하면 들어가요</p>
        <p th:if="${clubError != null}" class="notice" role="alert" data-toast="error" th:text="${clubError}">오류</p>
        <form method="post" th:action="@{/missions/clubs/join/{code}(code=${club.inviteCode()})}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-primary" th:text="${club.joinMode() == 'APPROVAL' ? '참여 요청' : '참여하기'}">참여하기</button>
        </form>
    </section>
    </div>
</main>
</body>
</html>
