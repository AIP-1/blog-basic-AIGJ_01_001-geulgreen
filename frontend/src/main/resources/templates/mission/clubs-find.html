<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>방 찾기 · 함께 쓰기 · 글그린</title>
</head>
<body>
<main class="list-page mission-page">
    <!-- 10-21 chan: 방 찾기 탭. 공개 방(승인 후 참여·누구나 바로)만, 링크로만인 방은 안 보임. 비어 있으면 방 만들기·초대가 바로 -->
    <h1>함께 쓰기</h1>
    <nav th:replace="~{mission/clubs :: clubTabs('find')}"></nav>
    <div class="club-top">
        <section class="mission-panel" aria-labelledby="clubs-open-heading">
            <h2 id="clubs-open-heading" class="club-sub-title">방 찾기</h2>
            <p class="help club-list-lead">공개된 방이에요. '누구나 바로'는 누르면 들어가고, '승인 후 참여'는 관리자가 승인하면 들어가요</p>
            <form method="get" action="/missions/clubs/find" role="search" class="club-search">
                <label for="club-q" class="visually-hidden">방 이름·소개로 찾기</label>
                <input id="club-q" type="search" name="q" maxlength="30" th:value="${q}" placeholder="방 이름·소개로 찾기">
                <button type="submit" class="btn btn-sm">찾기</button>
            </form>
            <div th:if="${listed.isEmpty()}" class="club-empty">
                <p th:text="${q.isEmpty() ? '아직 공개된 방이 없어요' : '「' + q + '」에 맞는 방이 없어요'}">없음</p>
                <p class="help">직접 방을 만들고 친구들에게 초대 링크를 보내 보세요. 반 친구들, 동네 친구들 누구와도 좋아요</p>
                <a href="/missions/clubs#club-new" class="btn btn-primary btn-sm">방 만들기</a>
            </div>
            <ul class="club-list" th:unless="${listed.isEmpty()}">
                <li th:each="c : ${listed}">
                    <a class="club-card" th:href="@{/missions/clubs/{id}(id=${c.id()})}">
                        <span class="club-card-top">
                            <strong class="club-card-name" th:text="${c.name()}">방</strong>
                            <span class="club-mode-badge" th:classappend="${c.joinMode() == 'OPEN'} ? 'is-open'" th:text="${c.modeLabel()}">방 종류</span>
                        </span>
                        <span th:if="${!c.intro().isEmpty()}" class="club-card-intro" th:text="${c.intro()}">소개</span>
                        <span class="help"><th:block th:replace="~{fragments/meta :: parts(${c.everyDays() + '일에 1편 · 멤버 ' + c.memberCount() + '/' + c.memberCap() + '명 · '
                                + #temporals.format(c.startDate(), 'M월 d일') + ' ~ ' + #temporals.format(c.endDate(), 'M월 d일')})}"></th:block></span>
                    </a>
                </li>
            </ul>
        </section>
    </div>
</main>
</body>
</html>
