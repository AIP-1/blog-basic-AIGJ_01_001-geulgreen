<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>친구 초대 · 글그린</title>
</head>
<body>
<!-- 10-25 chan: 내 초대 링크. 블로그 초대 하나와 아직 안 끝난 함께 쓰기 방마다 하나. 복사·공유는 js/invite/share.js -->
<main class="list-page mission-page invite-mine">
    <h1>친구 초대</h1>
    <p class="club-onboard-lead">링크를 반 단톡방이나 친구에게 보내면 돼요. 친구가 링크로 가입하면 나를 팔로우하고, 방 링크면 그 방에 바로 들어와요.</p>
    <ul class="invite-links" aria-label="내 초대 링크">
        <li th:each="l : ${links}" class="mission-panel invite-link" th:attr="data-invite-url=${siteOrigin + l.path()},data-invite-title=${l.label()}">
            <p class="invite-link-label" th:text="${l.label()}">내 블로그로 초대</p>
            <p th:if="${l.club().isPresent()}" class="help" th:text="${l.club().get().joinMode() == 'APPROVAL' ? '링크를 받은 친구는 참여 요청을 보내고, 관리자가 승인하면 들어와요' : '링크를 받은 친구는 바로 들어와요'}">안내</p>
            <p class="help invite-link-url" th:text="${siteOrigin + l.path()}">주소</p>
            <th:block th:replace="~{invite/share :: buttons}"></th:block>
        </li>
    </ul>
    <p class="help">함께 쓰기 방이 없으면 반 방이나 친구 방을 먼저 만들어도 좋아요. <a class="link-btn" href="/missions/clubs">함께 쓰기</a></p>
    <script th:src="@{/js/invite/share.js}" defer></script>
</main>
</body>
</html>
