<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${inquiry.title()}">문의</title>
</head>
<body>
<main class="list-page admin-page">
    <h1 th:text="${inquiry.title()}">문의</h1>
    <nav th:replace="~{fragments/admin-nav :: nav(${adminTab})}"></nav>
    <p class="admin-back"><a class="link-btn back" href="/admin/inquiries">문의함으로</a></p>
    <div class="admin-detail">
        <div class="admin-detail-main">
            <section class="admin-panel" aria-labelledby="inquiry-body-heading">
                <h2 id="inquiry-body-heading">문의 내용
                    <span th:class="${inquiry.done()} ? 'st st-ok' : 'st st-new'" th:text="${inquiry.done()} ? '처리 완료' : '새 문의'">새 문의</span>
                    <span class="st st-info" th:text="${inquiry.kindLabel()}">종류</span></h2>
                <p class="snapshot" th:text="${inquiry.content()}">내용</p>
            </section>
            <section class="admin-panel" th:unless="${messages.isEmpty()}" aria-labelledby="inquiry-thread-heading">
                <h2 id="inquiry-thread-heading">주고받은 답장</h2>
                <ol class="inquiry-thread">
                    <li th:each="m : ${messages}" th:class="${m.fromAdmin()} ? 'inquiry-msg from-admin' : 'inquiry-msg'">
                        <p class="inquiry-who"><strong th:text="${m.fromAdmin()} ? '관리자' : '보낸 사람'">관리자</strong>
                            <span th:text="${T(com.team.blog.shared.web.KoreanDateFormatter).dateTime(m.createdAt())}">시각</span></p>
                        <p class="inquiry-body" th:text="${m.body()}">답장</p>
                    </li>
                </ol>
            </section>
            <section class="admin-panel" aria-labelledby="inquiry-form-heading">
                <h2 id="inquiry-form-heading">답장하기</h2>
                <form method="post" th:action="@{/admin/inquiries/{id}/reply(id=${inquiry.id()})}" class="admin-form" id="inquiry-reply-form">
                    <input th:replace="~{fragments/admin-list :: csrf}">
                    <p th:if="${error != null}" class="form-error" role="alert" data-toast="error" th:text="${error}">오류</p>
                    <label for="inquiry-reply" class="visually-hidden">답장</label>
                    <textarea id="inquiry-reply" name="reply" required maxlength="3000" rows="8" th:text="${replyDraft}"></textarea>
                    <p class="help" th:text="${inquiry.memberHandle() != null} ? '보낸 회원의 내 문의에 보이고, 알림과 메일이 같이 가요. 회원은 거기서 다시 답할 수 있어요' : '비회원 문의라 메일로만 가요'">안내</p>
                </form>
                <div class="admin-form-bar">
                    <form th:unless="${inquiry.done()}" method="post" th:action="@{/admin/inquiries/{id}/close(id=${inquiry.id()})}">
                        <input th:replace="~{fragments/admin-list :: csrf}">
                        <input type="hidden" name="lastMessageId" th:value="${lastMessageId}">
                        <button type="submit" class="btn btn-sm">답장 없이 처리 완료</button>
                    </form>
                    <button type="submit" form="inquiry-reply-form" class="btn btn-primary btn-sm">답장 보내기</button>
                </div>
            </section>
        </div>
        <div class="admin-detail-side">
            <section class="admin-panel" aria-labelledby="inquiry-from-heading">
                <h2 id="inquiry-from-heading">보낸 사람</h2>
                <dl class="admin-server">
                    <div><dt>회원</dt><dd><a th:if="${inquiry.memberHandle() != null}" th:href="${paths.blog(inquiry.memberHandle())}" th:text="${'@' + inquiry.memberHandle()}">@회원</a>
                        <span th:unless="${inquiry.memberHandle() != null}">비회원</span></dd></div>
                    <div><dt>답장 주소</dt><dd th:text="${inquiry.email()}">메일</dd></div>
                    <div><dt>받은 시각</dt><dd th:text="${T(com.team.blog.shared.web.KoreanDateFormatter).dateTime(inquiry.createdAt())}">시각</dd></div>
                </dl>
            </section>
        </div>
    </div>
</main>
</body>
</html>
