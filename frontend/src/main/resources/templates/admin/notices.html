<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>사이트 공지</title>
</head>
<body>
<main class="list-page admin-page">
    <h1>사이트 공지</h1>
    <nav th:replace="~{fragments/admin-nav :: nav(${adminTab})}"></nav>
    <p class="help">켠 공지는 모든 화면 위에 띠로 보여요. 새 공지를 올리면 예전 공지는 꺼져요.</p>
    <form method="post" action="/admin/notices" class="note-form">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="notice-message">공지 (200자)</label>
        <input id="notice-message" name="message" type="text" maxlength="200" required placeholder="예: 10월 20일 새벽 2시에 잠깐 점검해요">
        <label for="notice-link">링크 (선택, /로 시작하거나 https)</label>
        <input id="notice-link" name="linkUrl" type="text" maxlength="300" placeholder="/아이디/posts/1">
        <div class="note-form-bar"><button type="submit" class="btn btn-primary btn-sm">공지 올리기</button></div>
    </form>
    <ul class="post-rows">
        <li th:each="n : ${notices}" class="post-row">
            <div class="row-main">
                <span th:text="${n.message()}">공지</span>
                <span class="badge" th:if="${n.active()}">켜짐</span>
                <span class="help" th:if="${n.linkUrl() != null}" th:text="${n.linkUrl()}">링크</span>
            </div>
            <form method="post" th:action="@{/admin/notices/{id}/off(id=${n.id()})}" th:if="${n.active()}" class="row-actions">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">끄기</button>
            </form>
        </li>
    </ul>
</main>
</body>
</html>
