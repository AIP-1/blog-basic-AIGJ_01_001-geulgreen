<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>관리 기록 · 글그린</title>
</head>
<body>
<main class="list-page admin-page">
    <h1>관리 기록</h1>
    <nav th:replace="~{fragments/admin-nav :: nav(${adminTab})}"></nav>
    <p class="help">신고 처리·회원 정지·글/댓글 숨기기·방명록 삭제·공지를 누가 언제 했는지 최근 100개예요.</p>
    <p th:if="${logs.isEmpty()}" class="empty-state">아직 기록이 없어요</p>
    <table class="stats-table admin-log-table" th:unless="${logs.isEmpty()}">
        <thead><tr><th scope="col">시각</th><th scope="col">관리자</th><th scope="col">한 일</th><th scope="col">대상</th><th scope="col">내용</th></tr></thead>
        <tbody>
        <tr th:each="l : ${logs}">
            <td th:text="${T(com.team.blog.shared.web.KoreanDateFormatter).dateTime(l.at())}">시각</td>
            <td th:text="${l.admin()}">관리자</td>
            <td th:text="${l.action()}">동작</td>
            <td th:text="${l.target()}">대상</td>
            <td th:text="${l.detail()}">내용</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
