<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>글·댓글 관리 · 글그린</title>
</head>
<body>
<main class="list-page admin-page">
    <h1>글·댓글 관리</h1>
    <nav th:replace="~{fragments/admin-nav :: nav(${adminTab})}"></nav>
    <p class="help">신고가 없어도 바로 숨길 수 있어요. 숨긴 글·댓글은 쓴 사람에게만 "숨겨졌어요"로 보여요.</p>
    <form method="get" action="/admin/content" class="search-form">
        <select name="type" aria-label="종류">
            <option value="posts" th:selected="${type == 'posts'}">글</option>
            <option value="comments" th:selected="${type == 'comments'}">댓글</option>
        </select>
        <label for="content-q" class="visually-hidden">찾을 말</label>
        <input id="content-q" type="search" name="q" th:value="${q}" placeholder="제목·내용·닉네임·주소">
        <button type="submit">찾기</button>
    </form>
    <p th:if="${rows.isEmpty()}" class="empty-state">찾은 결과가 없어요</p>
    <ul class="post-rows" th:if="${type == 'posts'}">
        <li th:each="r : ${rows}" class="post-row">
            <div class="row-main">
                <a th:href="${r.url()}" th:text="${r.title()}">제목</a>
                <span class="help" th:text="${r.nickname() + ' @' + r.handle() + ' · 조회 ' + r.views() + ' · 댓글 ' + r.comments()}">글쓴이</span>
                <span class="badge" th:if="${r.visibility() != 'PUBLIC'}" th:text="${r.visibility()}">범위</span>
                <span class="badge" th:if="${r.hidden()}">숨김</span>
            </div>
            <div class="row-actions">
                <form method="post" th:action="@{/admin/posts/{id}/hide(id=${r.id()})}" th:unless="${r.hidden()}" class="inline-form">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <select name="reason" aria-label="숨김 사유"><option th:each="x : ${reasons}" th:value="${x.name()}" th:text="${x.label()}">사유</option></select>
                    <button type="submit">숨기기</button>
                </form>
                <form method="post" th:action="@{/admin/posts/{id}/unhide(id=${r.id()})}" th:if="${r.hidden()}">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">숨김 해제</button>
                </form>
            </div>
        </li>
    </ul>
    <ul class="post-rows" th:if="${type == 'comments'}">
        <li th:each="r : ${rows}" class="post-row">
            <div class="row-main">
                <p class="comment-content" th:text="${r.content()}">댓글</p>
                <span class="help" th:text="${r.nickname() + ' @' + r.handle() + ' · 글: '}">쓴 사람</span><a th:href="${r.url()}" th:text="${r.postTitle()}">글</a>
                <span class="badge" th:if="${r.hidden()}">숨김</span>
            </div>
            <div class="row-actions">
                <form method="post" th:action="@{/admin/comments/{id}/hide(id=${r.id()})}" th:unless="${r.hidden()}" class="inline-form">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <select name="reason" aria-label="숨김 사유"><option th:each="x : ${reasons}" th:value="${x.name()}" th:text="${x.label()}">사유</option></select>
                    <button type="submit">숨기기</button>
                </form>
                <form method="post" th:action="@{/admin/comments/{id}/unhide(id=${r.id()})}" th:if="${r.hidden()}">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">숨김 해제</button>
                </form>
            </div>
        </li>
    </ul>
</main>
</body>
</html>
