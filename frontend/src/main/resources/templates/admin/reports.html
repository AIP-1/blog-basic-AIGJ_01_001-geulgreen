<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>신고 관리 · 글그린</title>
</head>
<body>
<main class="list-page admin-page">
    <h1>신고 관리</h1>
    <nav th:replace="~{fragments/admin-nav :: nav('reports')}"></nav>
    <nav class="manage-tabs admin-tabs" aria-label="신고 탭">
        <a href="/admin/reports" th:attr="aria-current=${tab == 'pending' ? 'page' : null}">대기</a>
        <a href="/admin/reports?tab=done" th:attr="aria-current=${tab == 'done' ? 'page' : null}">처리됨</a>
    </nav>
    <section class="admin-panel admin-list" aria-label="신고 목록">
        <form method="get" action="/admin/reports" class="admin-toolbar">
            <div class="admin-search">
                <label for="report-q" class="visually-hidden">신고된 제목·내용</label>
                <input id="report-q" type="search" name="q" th:value="${q}" placeholder="신고된 제목·내용">
                <input type="hidden" name="tab" th:value="${tab}"><input type="hidden" name="type" th:value="${type}">
                <button type="submit" class="btn btn-sm">찾기</button>
            </div>
            <nav class="admin-chips" aria-label="대상 종류">
                <a th:href="@{/admin/reports(tab=${tab},q=${q})}" th:attr="aria-current=${type == 'all'} ? 'true'">전체</a>
                <a th:href="@{/admin/reports(tab=${tab},q=${q},type='POST')}" th:attr="aria-current=${type == 'POST'} ? 'true'">글</a>
                <a th:href="@{/admin/reports(tab=${tab},q=${q},type='COMMENT')}" th:attr="aria-current=${type == 'COMMENT'} ? 'true'">댓글</a>
            </nav>
            <p th:replace="~{fragments/admin-list :: count(${list})}"></p>
        </form>
        <p th:if="${list.empty()}" class="panel-empty" th:text="${tab == 'pending' ? '대기 중인 신고가 없어요.' : '처리한 신고가 없어요.'}">없음</p>
        <ul class="admin-rows" th:unless="${list.empty()}">
            <li th:each="c : ${list.rows()}" class="admin-row">
                <div class="admin-row-main">
                    <p class="admin-row-title">
                        <span th:if="${tab == 'pending'}" class="st st-new">대기</span>
                        <span th:if="${tab == 'done'}" th:class="${c.status() == 'HIDDEN' ? 'st st-bad' : 'st st-muted'}"
                              th:text="${c.status() == 'HIDDEN' ? '숨김' : (c.status() == 'REJECTED' ? '반려' : '대상 없음')}">숨김</span>
                        <span class="st st-info" th:text="${c.targetType() == 'POST' ? '글' : '댓글'}">글</span>
                        <a class="row-link" th:href="@{/admin/reports/{id}(id=${c.id()})}"
                           th:text="${c.snapshotTitle() != null ? c.snapshotTitle() : (c.snapshotContent() != null ? c.snapshotContent() : '(내용 없음)')}">제목</a>
                    </p>
                    <p class="admin-row-text" th:if="${c.snapshotTitle() != null and c.snapshotContent() != null}" th:text="${c.snapshotContent()}">내용</p>
                    <p class="admin-row-meta"><strong th:text="${'신고 ' + c.reportCount() + '건'}">신고 3건</strong>
                        <span th:if="${c.lastReportedAt() != null}" th:text="${'마지막 신고 ' + T(com.team.blog.shared.web.KoreanDateFormatter).dateTime(c.lastReportedAt())}">시각</span>
                        <span th:if="${c.handledAt() != null}" th:text="${'처리 ' + T(com.team.blog.shared.web.KoreanDateFormatter).dateTime(c.handledAt())}">처리</span></p>
                </div>
                <div class="admin-row-actions">
                    <a th:if="${tab == 'pending'}" class="btn btn-sm btn-primary" th:href="@{/admin/reports/{id}(id=${c.id()})}">살펴보기</a>
                    <form method="post" th:action="@{/admin/reports/{id}/unhide(id=${c.id()})}" th:if="${tab == 'done' and c.status() == 'HIDDEN' and c.targetHidden()}">
                        <input th:replace="~{fragments/admin-list :: csrf}">
                        <button type="submit" class="btn btn-sm">숨김 해제</button>
                    </form>
                </div>
            </li>
        </ul>
        <nav th:replace="~{fragments/admin-list :: pager(${list})}"></nav>
    </section>
</main>
</body>
</html>
