<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>방명록 관리</title>
</head>
<body>
<main class="list-page admin-page">
    <h1>방명록 관리</h1>
    <nav th:replace="~{fragments/admin-nav :: nav(${adminTab})}"></nav>
    <p class="help">모든 블로그의 최근 방명록 100개예요. 비밀글도 관리자에게는 보여요.</p>
    <p th:if="${entries.isEmpty()}" class="empty-state">아직 방명록이 없어요</p>
    <ul class="post-rows">
        <li th:each="e : ${entries}" class="post-row">
            <div class="row-main">
                <p class="comment-content" th:text="${e.content()}">내용</p>
                <span class="help" th:text="${e.nickname() + ' @' + e.handle() + ' → '}">쓴 사람</span><a th:href="${'/@' + e.ownerHandle() + '/guestbook'}" th:text="${'@' + e.ownerHandle()}">블로그</a>
                <span class="badge" th:if="${e.secret()}">비밀글</span>
            </div>
            <form method="post" th:action="@{/admin/guestbook/{id}/delete(id=${e.id()})}" class="row-actions">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">지우기</button>
            </form>
        </li>
    </ul>
</main>
</body>
</html>
