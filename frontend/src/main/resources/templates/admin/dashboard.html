<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>관리 대시보드 · 글그린</title>
</head>
<body>
<main class="list-page admin-page">
    <h1>관리 대시보드</h1>
    <nav th:replace="~{fragments/admin-nav :: nav(${adminTab})}"></nav>
    <ul class="admin-stats">
        <li><span class="help">전체 회원</span><strong th:text="${dash.totalMembers()}">0</strong><span class="help" th:text="${'오늘 +' + dash.todayMembers()}">오늘</span></li>
        <li><span class="help">발행한 글</span><strong th:text="${dash.totalPosts()}">0</strong><span class="help" th:text="${'오늘 +' + dash.todayPosts()}">오늘</span></li>
        <li><span class="help">댓글</span><strong th:text="${dash.totalComments()}">0</strong><span class="help" th:text="${'오늘 +' + dash.todayComments()}">오늘</span></li>
        <li th:classappend="${dash.pendingReports() > 0} ? 'admin-alert'"><span class="help">처리할 신고</span>
            <strong th:text="${dash.pendingReports()}">0</strong><a class="link-btn" href="/admin/reports">신고 보기</a></li>
    </ul>
    <section aria-labelledby="week-heading" class="admin-week">
        <h2 id="week-heading">최근 7일</h2>
        <p class="help"><span class="legend legend-members"></span>가입 <span class="legend legend-posts"></span>글 <span class="legend legend-comments"></span>댓글</p>
        <div class="admin-bars" role="img" aria-label="최근 7일 가입·글·댓글 수(아래 표와 같음)">
            <div class="admin-day" th:each="d : ${dash.week()}">
                <div class="admin-day-bars">
                    <span class="bar bar-members" th:style="${'height:' + (d.members() * 100 / dash.maxDaily()) + '%'}"></span>
                    <span class="bar bar-posts" th:style="${'height:' + (d.posts() * 100 / dash.maxDaily()) + '%'}"></span>
                    <span class="bar bar-comments" th:style="${'height:' + (d.comments() * 100 / dash.maxDaily()) + '%'}"></span>
                </div>
                <span class="help" th:text="${d.date().getMonthValue() + '/' + d.date().getDayOfMonth()}">10/12</span>
            </div>
        </div>
        <table class="stats-table">
            <thead><tr><th scope="col">날짜</th><th scope="col">가입</th><th scope="col">글</th><th scope="col">댓글</th></tr></thead>
            <tbody><tr th:each="d : ${dash.week()}"><td th:text="${d.date()}">날짜</td><td th:text="${d.members()}">0</td>
                <td th:text="${d.posts()}">0</td><td th:text="${d.comments()}">0</td></tr></tbody>
        </table>
    </section>
    <section aria-labelledby="sample-heading" th:if="${samplePostsEnabled}">
        <h2 id="sample-heading">테스트용 긴 글</h2>
        <p class="help" th:text="${'테스트 계정 4개(@test_로 시작)가 쓴 긴 글이에요. 지금 ' + samplePostCount + '편 있어요. 다시 눌러도 이미 있는 글은 건너뛰어요.'}">테스트 글</p>
        <form method="post" action="/admin/sample-posts" class="row-actions">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-primary btn-sm">테스트 글 넣기</button>
        </form>
        <form method="post" action="/admin/sample-posts/remove" class="row-actions" th:if="${samplePostCount > 0}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-sm">테스트 계정과 글 모두 지우기</button>
        </form>
    </section>
</main>
</body>
</html>
