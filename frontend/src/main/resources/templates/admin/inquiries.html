<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>문의함 · 글그린</title>
</head>
<body>
<!-- 090 강성찬 개인 확장: 관리자 문의함(새 문의 먼저) -->
<main class="list-page admin-page">
    <h1>문의함</h1>
    <nav th:replace="~{fragments/admin-nav :: nav(${adminTab})}"></nav>
    <section class="admin-panel admin-list" aria-label="문의 목록">
        <form method="get" action="/admin/inquiries" class="admin-toolbar">
            <div class="admin-search">
                <label for="inquiry-q" class="visually-hidden">제목·내용·메일·아이디</label>
                <input id="inquiry-q" type="search" name="q" th:value="${q}" placeholder="제목·내용·메일·아이디">
                <input type="hidden" name="status" th:value="${status}">
                <button type="submit" class="btn btn-sm">찾기</button>
            </div>
            <nav class="admin-chips" aria-label="처리 상태">
                <a th:href="@{/admin/inquiries(q=${q})}" th:attr="aria-current=${status == 'all'} ? 'true'">전체</a>
                <a th:href="@{/admin/inquiries(q=${q},status='new')}" th:attr="aria-current=${status == 'new'} ? 'true'">새 문의</a>
                <a th:href="@{/admin/inquiries(q=${q},status='done')}" th:attr="aria-current=${status == 'done'} ? 'true'">처리 완료</a>
            </nav>
            <p th:replace="~{fragments/admin-list :: count(${list})}"></p>
        </form>
        <p class="help admin-list-note">문의하기 양식으로 온 문의예요. 열어서 답장하면 처리 완료가 돼요.</p>
        <p th:if="${list.empty()}" class="panel-empty">조건에 맞는 문의가 없어요.</p>
        <ul class="admin-rows" th:unless="${list.empty()}">
            <li th:each="i : ${list.rows()}" class="admin-row">
                <div class="admin-row-main">
                    <p class="admin-row-title">
                        <span th:class="${i.done()} ? 'st st-ok' : 'st st-new'" th:text="${i.done()} ? '처리 완료' : '새 문의'">새 문의</span>
                        <span class="st st-info" th:text="${i.kindLabel()}">종류</span>
                        <a class="row-link" th:href="@{/admin/inquiries/{id}(id=${i.id()})}" th:text="${i.title()}">제목</a>
                    </p>
                    <p class="admin-row-text" th:text="${i.content()}">내용</p>
                    <p class="admin-row-meta"><span th:text="${i.memberHandle() != null ? '@' + i.memberHandle() : '비회원'}">보낸 사람</span>
                        <span th:text="${T(com.team.blog.shared.web.KoreanDateFormatter).dateTime(i.createdAt())}">시각</span></p>
                </div>
                <div class="admin-row-actions">
                    <a class="btn btn-sm" th:classappend="${i.done()} ? '' : 'btn-primary'" th:href="@{/admin/inquiries/{id}(id=${i.id()})}"
                       th:text="${i.done()} ? '보기' : '답장하기'">답장하기</a>
                </div>
            </li>
        </ul>
        <nav th:replace="~{fragments/admin-list :: pager(${list})}"></nav>
    </section>
</main>
</body>
</html>
