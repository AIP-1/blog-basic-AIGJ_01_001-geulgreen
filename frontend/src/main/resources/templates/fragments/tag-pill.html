<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 056 태그 알약(강성찬 개인 확장): 아이콘·이름·글 수·→(# 아이콘이 있어 이름 앞 #은 빼요). tagStyle = TagIconCatalog.Style(없으면 # 회색) -->
<a th:fragment="pill(tagName, tagCount, tagStyle)" th:href="@{/tags/{n}(n=${tagName})}"
   th:class="${'tag-pill tone-' + (tagStyle != null ? tagStyle.tone() : 'gray')}"
   th:attr="aria-label=${'#' + tagName + ' ' + tagCount + '개'}">
    <svg th:replace="~{fragments/tag-icons :: icon(${tagStyle != null ? tagStyle.icon() : 'hash'})}"></svg>
    <span class="tag-pill-name" th:text="${tagName}">태그</span>
    <span class="tag-pill-count" th:text="${tagCount}">3</span>
    <span class="tag-pill-arrow" aria-hidden="true">→</span>
</a>
</body>
</html>
