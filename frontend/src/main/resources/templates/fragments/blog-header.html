<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 블로그 머리말(프로필) + 100 강성찬 개인 확장: 탭(홈·글·시리즈). 값은 BlogHeaderModel이 넣는다 -->
<th:block th:fragment="header">
    <div class="blog-cover" aria-hidden="true"></div>
    <header class="blog-header profile-header">
        <th:block th:replace="~{fragments/avatar :: avatar(${owner.avatar()}, 96)}"></th:block>
        <div class="profile-text">
            <h1 th:replace="~{fragments/author :: profile(${author})}">아이디 / 닉네임</h1>
            <!-- 소개는 글자로만(이스케이프), 줄바꿈만 살리고 자동 링크 없음(003 FR-009·FR-010) -->
            <p class="profile-bio" th:if="${owner.bio() != null}" th:text="${owner.bio()}">소개</p>
            <!-- 074 강성찬 개인 확장: 인스타식 숫자 줄(게시물·팔로워·팔로잉)과 내 블로그면 프로필 편집 -->
            <ul class="insta-stats" th:if="${instaAccount}">
                <li th:text="${'게시물 ' + publicCount}">게시물 24</li>
                <li><a th:href="${paths.blog(owner.handle()) + '/followers'}" th:text="${'팔로워 ' + followCounts.followers()}">팔로워 12</a></li>
                <li><a th:href="${paths.blog(owner.handle()) + '/following'}" th:text="${'팔로잉 ' + followCounts.following()}">팔로잉 30</a></li>
                <li th:if="${friendCount != null}"><a href="/settings/friends" th:text="${'친구 ' + friendCount}">친구 3</a></li>
            </ul>
            <p th:if="${instaAccount and isOwner}"><a class="btn btn-sm" href="/settings#settings-profile">프로필 편집</a></p>
            <p class="blog-visits" th:if="${instaAccount and blogVisits != null}"><svg th:replace="~{fragments/icons :: i-chart}"></svg>
                <span><th:block th:replace="~{fragments/meta :: parts(${'오늘 ' + blogVisits.today() + ' · 전체 ' + blogVisits.total()})}"></th:block></span></p>
            <p class="help" th:unless="${instaAccount}">
                <!-- 051 강성찬 개인 확장: 방문자 수 -->
                <span th:if="${blogVisits != null}"><th:block th:replace="~{fragments/meta :: parts(${'오늘 ' + blogVisits.today() + ' · 전체 ' + blogVisits.total()})}"></th:block></span><span th:if="${blogVisits != null}"> · </span>
                <span th:text="${'공개 글 ' + publicCount}">공개 글 24</span> ·
                <a th:href="${paths.blog(owner.handle()) + '/followers'}" th:text="${'팔로워 ' + followCounts.followers()}">팔로워 12</a> ·
                <a th:href="${paths.blog(owner.handle()) + '/following'}" th:text="${'팔로잉 ' + followCounts.following()}">팔로잉 30</a><th:block th:if="${friendCount != null}"> ·
                <a href="/settings/friends" th:text="${'친구 ' + friendCount}">친구 3</a></th:block>
            </p>
            <!-- 040·044 강성찬 개인 확장: 방명록·RSS(시리즈는 아래 탭으로, 100) -->
            <p class="blog-links" th:if="${guestbookEnabled or rssEnabled}">
                <a th:if="${guestbookEnabled}" th:href="${paths.blog(owner.handle()) + '/guestbook'}"><svg th:replace="~{fragments/icons :: comment}"></svg>방명록</a>
                <a th:if="${rssEnabled}" th:href="${paths.blog(owner.handle()) + '/rss'}"><svg th:replace="~{fragments/icons :: rss}"></svg>RSS</a>
            </p>
            <!-- 018 팔로우 버튼(내 블로그에서는 없음) -->
            <p th:unless="${isOwner}">
                <th:block th:replace="~{fragments/follow :: button(${owner.handle()}, ${followingOwner}, ${currentMemberId != null}, ${loginRedirect}, ${paths.blog(owner.handle())})}"></th:block>
                <!-- 025·069 강성찬 개인 확장: 친한 친구 버튼(내가 주인을 팔로우할 때만) -->
                <th:block th:replace="~{fragments/friend :: button(${owner.handle()}, ${friendStatus}, ${paths.blog(owner.handle())})}"></th:block>
            </p>
            <p class="follow-message help" role="status" hidden data-toast="success"></p>
        </div>
    </header>
    <nav class="manage-tabs blog-tabs" aria-label="블로그 메뉴">
        <a th:href="${paths.blog(owner.handle())}" th:attr="aria-current=${blogTab == 'home' ? 'page' : null}">홈</a>
        <a th:href="${paths.blog(owner.handle()) + '/posts'}" th:attr="aria-current=${blogTab == 'posts' ? 'page' : null}">글</a>
        <a th:if="${seriesEnabled}" th:href="${paths.blog(owner.handle()) + '/series'}" th:attr="aria-current=${blogTab == 'series' ? 'page' : null}">시리즈</a>
    </nav>
</th:block>
<!-- 홈 선반 제목 줄: 제목 + 그 탭으로 가는 "모두 보기 >" -->
<h2 th:fragment="shelfHead(id, title, href)" class="shelf-head" th:id="${id}"><span th:text="${title}">최근 글</span>
    <a class="shelf-more" th:href="${href}">모두 보기<svg class="icon icon-inline" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"
        focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></a></h2>
</body>
</html>
