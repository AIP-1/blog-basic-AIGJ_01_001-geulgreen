<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  글 카드(10 §2, 009 FR-010~FR-014). card = post.application.PostCard, date = 표시 날짜, showAuthor = 작성자 영역 표시 여부.
  카드 전체는 제목 링크를 늘린 영역(::after)으로 글 상세에, 작성자 링크는 그 위에 따로 블로그로 간다(키보드 링크 2개).
  출력은 th:text(이스케이프)만 쓴다.
-->
<article th:fragment="card(card, date, showAuthor)" th:replace="~{fragments/post-card :: cardWith(${card}, ${date}, ${showAuthor}, ~{})}"></article>
<!-- 067 후속(강성찬 개인 확장): extra = 카드 안에 덧붙일 조각(내 글 관리의 상태 배지·⋯ 메뉴). 홈 등은 빈 조각 -->
<article th:fragment="cardWith(card, date, showAuthor, extra)" class="post-card" th:attr="data-post-id=${card.id()}">
    <div class="card-body">
        <th:block th:replace="${extra}"></th:block>
        <!-- 084 강성찬 개인 확장: 머리 줄은 늘 두고(비면 CSS가 숨김, 옆 카드에 있으면 같은 높이로 자리) -->
        <p class="card-top">
            <a th:if="${showAuthor}" class="card-author" th:href="${paths.blog(card.author().handle())}">
                <th:block th:replace="~{fragments/avatar :: avatar(${card.author().avatar()}, 24)}"></th:block>
                <span th:text="${card.author().handle()}">아이디</span></a>
            <!-- 시안(10-08): 첫 태그를 카드 머리에. 10-22: 한 가지 차분한 색, 글자는 안쪽 span이 줄인다(누르는 영역 ::before가 잘리지 않게) -->
            <a th:if="${card.firstTag() != null}" class="card-tag"
               th:href="@{/tags/{name}(name=${card.firstTag()})}"><span th:text="${card.firstTag()}">태그</span></a>
        </p>
        <!-- 제목의 " · "는 뒤 낱말과 붙여 가운뎃점이 줄 끝에 홀로 남지 않게 -->
        <h2 class="card-title"><a class="card-link" th:href="${card.url()}" th:title="${card.title()}" th:text="${#strings.replace(card.title(), ' · ', ' ·&#160;')}">제목</a></h2>
        <p class="card-excerpt" th:if="${snippetHtml == null}" th:text="${card.excerpt()}">요약</p>
        <!-- 검색(086): 서버가 이스케이프하고 검색어에만 <mark>를 붙인 미리보기 -->
        <p class="card-excerpt" th:if="${snippetHtml != null}" th:utext="${snippetHtml}">미리보기</p>
    </div>
    <!-- 시안(10-08): 사진이 없으면 빈 칸을 두지 않는다 -->
    <div class="card-thumb" th:if="${card.thumbnailUrl() != null}">
        <img th:src="${card.thumbnailUrl()}" th:alt="${card.title()}" loading="lazy">
    </div>
    <!-- 10-18 강성찬 개인 확장: 사진이 없는 글은 기본 썸네일(잠자는 고양이). 화면에서만 그리고 글에는 저장하지 않는다(사진·만든 썸네일이 있으면 그쪽) -->
    <div class="card-thumb card-cover" th:if="${card.thumbnailUrl() == null}" aria-hidden="true"></div>
    <p class="card-foot">
        <span class="card-likes" th:attr="aria-label=${'좋아요 ' + card.likeCount()}"><svg th:replace="~{fragments/icons :: heart}"></svg><span th:text="${card.likeCount()}">12</span></span>
        <span class="card-comments" th:attr="aria-label=${'댓글 ' + card.commentCount()}"><svg th:replace="~{fragments/icons :: comment}"></svg><span th:text="${card.commentCount()}">3</span></span>
        <time class="card-date" th:attr="datetime=${card.firstPublicAt()}" th:text="${date}">2026.10.02</time>
    </p>
</article>

<!-- 10-23 강성찬 개인 확장: 피드 한 줄(친구 소식). 얼굴·아이디·시각이 먼저, 진짜 사진이 있을 때만 작은 사진(기본 고양이 표지는 쓰지 않는다).
     줄 전체는 제목 링크를 늘린 영역(::after)으로 글에, 얼굴·아이디·태그는 그 위에 따로. list-more.js의 row()와 같은 모양
     10-25(chan "글 부분 가독성, 썸네일 잘림"): 태그는 이름 줄 끝에서 아래 반응 줄로, 사진은 표지 비율(16:10) 그대로 -->
<li th:fragment="row(card, date, day)" class="feed-item" th:classappend="${card.thumbnailUrl() == null} ? 'no-thumb'"
    th:attr="data-post-id=${card.id()},data-day=${day}">
    <a class="feed-avatar" th:href="${paths.blog(card.author().handle())}" tabindex="-1" aria-hidden="true">
        <th:block th:replace="~{fragments/avatar :: avatar(${card.author().avatar()}, 40)}"></th:block></a>
    <div class="feed-body">
        <p class="feed-who"><a class="feed-handle" th:href="${paths.blog(card.author().handle())}" th:text="${card.author().handle()}">아이디</a>
            <time th:attr="datetime=${card.firstPublicAt()}" th:text="${date}">2시간 전</time></p>
        <h3 class="feed-title"><a class="card-link" th:href="${card.url()}" th:text="${card.title()}">제목</a></h3>
        <p class="feed-excerpt" th:text="${card.excerpt()}">요약</p>
        <p class="card-foot">
            <span class="card-likes" th:attr="aria-label=${'좋아요 ' + card.likeCount()}"><svg th:replace="~{fragments/icons :: heart}"></svg><span th:text="${card.likeCount()}">12</span></span>
            <span class="card-comments" th:attr="aria-label=${'댓글 ' + card.commentCount()}"><svg th:replace="~{fragments/icons :: comment}"></svg><span th:text="${card.commentCount()}">3</span></span>
            <a th:if="${card.firstTag() != null}" class="feed-tag" th:href="@{/tags/{name}(name=${card.firstTag()})}" th:text="${'#' + card.firstTag()}">#태그</a>
        </p>
    </div>
    <div class="feed-thumb" th:if="${card.thumbnailUrl() != null}"><img th:src="${card.thumbnailUrl()}" alt="" loading="lazy"></div>
</li>

<!-- [더 보기] 영역: JS가 없으면 ?cursor= 링크로 다음 묶음(PostListQuery.PAGE_SIZE) -->
<!-- 019: 링크 모양({@code linkBase})과 순위가 사라졌을 때 갈 주소({@code expiredUrl})를 받는 판 -->
<div th:fragment="moreWith(nextCursor, listApi, showAuthor, hasCards, linkBase, expiredUrl)" class="list-more"
     th:attr="data-list-api=${listApi},data-show-author=${showAuthor},data-link-base=${linkBase},data-expired-url=${expiredUrl}">
    <a th:if="${nextCursor != null}" class="more-button" th:href="${linkBase + nextCursor}" th:attr="data-cursor=${nextCursor}">더 보기</a>
    <p th:if="${nextCursor == null and hasCards}" class="help list-end">모든 글을 다 봤어요</p>
    <p class="list-error" role="alert" hidden>불러오지 못했어요 <button type="button" class="list-retry">다시 시도</button></p>
</div>
<div th:fragment="more(nextCursor, listApi, showAuthor, hasCards)" class="list-more" th:attr="data-list-api=${listApi},data-show-author=${showAuthor}">
    <a th:if="${nextCursor != null}" class="more-button" th:href="${'?cursor=' + nextCursor}" th:attr="data-cursor=${nextCursor}">더 보기</a>
    <p th:if="${nextCursor == null and hasCards}" class="help list-end">모든 글을 다 봤어요</p>
    <p class="list-error" role="alert" hidden>불러오지 못했어요 <button type="button" class="list-retry">다시 시도</button></p>
</div>
</body>
</html>
