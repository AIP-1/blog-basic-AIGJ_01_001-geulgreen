<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>글그린 블로그 - 매일 쓴 글이 잔디처럼 자라는 곳</title>
</head>
<body>
<main class="list-page">
    <!-- 067 첫 배너 사진은 css를 읽기 전에 미리 받기 시작(강성찬 개인 확장) -->
    <link th:if="${heroPhoto and !continued}" rel="preload" as="image" th:href="@{/images/hero.webp}" media="(prefers-color-scheme: light)" fetchpriority="high">
    <link th:if="${heroPhoto and !continued}" rel="preload" as="image" th:href="@{/images/hero-night.webp}" media="(prefers-color-scheme: dark)" fetchpriority="high">
    <p th:if="${welcomeBack != null}" class="notice" role="status" data-toast="success">다시 오신 걸 환영해요</p>
    <!-- 시안(10-08) 소개 영역: 첫 화면에만, 화면 폭 전체. 사진(static/images/hero.webp)이 있으면 배경, 없으면 고양이 그림 -->
    <section class="hero" th:unless="${continued}" th:classappend="${heroPhoto} ? 'hero-photo'" aria-label="소개">
        <div class="hero-inner">
            <div class="hero-text">
                <p class="hero-slogan">좋은 글이<br><span>머무는 곳</span> <th:block th:replace="~{fragments/icons :: paw}"></th:block></p>
                <p class="hero-sub">다양한 사람들이 전하는<br>일상과 개발, 그리고 생각들</p>
                <form method="get" action="/search" role="search" class="hero-search">
                    <label for="hero-q" class="visually-hidden">글 검색</label>
                    <input id="hero-q" type="search" name="q" maxlength="50" placeholder="읽고 싶은 글을 검색해 보세요">
                    <button type="submit" class="hero-search-button" aria-label="검색"><th:block th:replace="~{fragments/icons :: search}"></th:block></button>
                </form>
            </div>
            <div class="hero-art" th:unless="${heroPhoto}"><th:block th:replace="~{fragments/icons :: cat}"></th:block></div>
        </div>
    </section>
    <!-- 강성찬 개인 확장(10-16): 처음 온 사람 안내. 배너 사진에 그려진 슬로건은 그대로, 그 아래에 무엇을 하는 곳인지 한 줄 -->
    <div class="home-intro" th:unless="${continued}">
        <p><th:block th:replace="~{fragments/icons :: grass}"></th:block>
            <span>매일 오늘의 주제로 글을 쓰면, 쓴 날이 블로그에 잔디처럼 쌓여요.</span></p>
        <a th:if="${missionsEnabled == true}" href="/missions" class="btn btn-sm">오늘의 미션 보기</a>
    </div>
    <!-- 로그인했고 발행한 글이 없는 사람에게만: 시작하기 3단계(첫 글을 쓰면 사라짐) -->
    <section th:if="${showStartGuide == true and !continued}" class="start-guide" aria-labelledby="start-guide-heading">
        <h2 id="start-guide-heading">글그린 시작하기</h2>
        <ol class="start-steps">
            <li><a href="/settings"><span class="start-no">1</span><span><strong>프로필 꾸미기</strong><span class="help">사진과 소개를 넣어요</span></span></a></li>
            <li th:if="${missionsEnabled == true}"><a href="/missions"><span class="start-no">2</span><span><strong>오늘의 주제 보기</strong><span class="help">무엇을 쓸지 고민될 때</span></span></a></li>
            <li>
                <form method="post" action="/write">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"><span class="start-no" th:text="${missionsEnabled == true ? 3 : 2}">3</span><span><strong>첫 글 쓰기</strong><span class="help">짧아도 괜찮아요</span></span></button>
                </form>
            </li>
        </ol>
    </section>
    <div class="home-layout">
    <div class="home-main">
    <h1 class="visually-hidden">전체 글</h1>
    <!-- 086 강성찬 개인 확장: 트렌딩·새로 온 작가·추천은 탐색으로 옮겨 홈은 최신 글 하나 -->
    <!-- 홈은 한 칸(오른쪽 칸 없음). 목록이 끝없이 이어져 꼬리말에 닿기 어려우니 넓은 화면은 사이트 링크를 제목 줄 오른쪽에(좁은 화면은 ☰ 메뉴) -->
    <div class="home-title-row">
        <h2 class="home-section-title">최신 글</h2>
        <nav class="side-links home-links" aria-label="사이트 정보">
            <a href="/terms">이용약관</a> <a href="https://github.com/AIPKANG" class="github-link" target="_blank" rel="noopener"><th:block th:replace="~{fragments/icons :: github}"></th:block>GitHub</a> <a href="/privacy">개인정보 처리방침</a> <a href="/releases">릴리스 노트</a>
            <a th:if="${contactPage == true}" href="/contact">문의하기</a><a th:if="${contactPage != true and contactEmail != null}" th:href="${'mailto:' + contactEmail}">문의하기</a>
        </nav>
    </div>
    <p th:if="${continued}"><a class="link-btn" href="/">처음부터 보기</a></p>
    <th:block th:if="${cards.isEmpty() and !continued}">
        <div class="empty-state">아직 올라온 글이 없어요. 첫 글의 주인공이 되어 보세요
            <th:block th:if="${currentMemberId != null}">
                <form method="post" action="/write" class="inline-form">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">글쓰기</button>
                </form>
            </th:block>
            <a th:unless="${currentMemberId != null}" href="/login">로그인</a>
        </div>
    </th:block>
    <div class="card-grid home-cards" id="card-grid">
        <th:block th:each="card : ${cards}">
            <article th:replace="~{fragments/post-card :: card(${card}, ${cardDates.get(card.id())}, true)}"></article>
        </th:block>
    </div>
    <div th:replace="~{fragments/post-card :: more(${nextCursor}, ${listApi}, true, ${!cards.isEmpty()})}"></div>
    </div>
    </div>
    <script th:src="@{/js/post/list-more.js}" defer></script>
</main>
</body>
</html>
