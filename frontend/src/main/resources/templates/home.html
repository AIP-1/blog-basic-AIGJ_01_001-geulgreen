<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>글그린</title>
</head>
<body>
<main class="list-page">
    <!-- 067 첫 배너 사진은 css를 읽기 전에 미리 받기 시작(강성찬 개인 확장) -->
    <link th:if="${heroPhoto and !continued}" rel="preload" as="image" th:href="@{/images/hero.webp}" fetchpriority="high">
    <p th:if="${welcomeBack != null}" class="notice" role="status">다시 오신 걸 환영해요</p>
    <!-- 시안(10-08) 소개 영역: 첫 화면에만, 화면 폭 전체. 사진(static/images/hero.webp)이 있으면 배경, 없으면 고양이 그림 -->
    <section class="hero" th:unless="${continued}" th:classappend="${heroPhoto} ? 'hero-photo'" aria-label="소개">
        <div class="hero-inner">
            <div class="hero-text">
                <p class="hero-slogan">좋은 글이<br><span>머무는 곳</span> <th:block th:replace="~{fragments/icons :: paw}"></th:block></p>
                <p class="hero-sub">다양한 사람들이 전하는<br>일상과 개발, 그리고 생각들</p>
                <form method="get" action="/search" role="search" class="hero-search">
                    <label for="hero-q" class="visually-hidden">글 검색</label>
                    <input id="hero-q" type="search" name="q" maxlength="50" placeholder="읽고 싶은 글을 검색해 보세요">
                    <button type="submit" class="hero-search-button" aria-label="검색"><th:block th:replace="~{fragments/icons :: search}"></th:block></button>
                </form>
            </div>
            <div class="hero-art" th:unless="${heroPhoto}"><th:block th:replace="~{fragments/icons :: cat}"></th:block></div>
        </div>
    </section>
    <div class="home-layout">
    <div class="home-main">
    <h1 class="visually-hidden" th:text="${tab == 'trending' ? '트렌딩' : '전체 글'}">전체 글</h1>
    <!-- 019 [최신] [트렌딩] 탭(기본 최신). 인기 태그는 오른쪽 상자 하나로(067 강성찬 개인 확장) -->
    <div class="home-tabs-row">
        <nav class="manage-tabs home-tabs" aria-label="목록 탭">
            <a href="/" th:attr="aria-current=${tab == 'latest' ? 'page' : null}">최신 글</a>
            <a href="/?tab=trending" th:attr="aria-current=${tab == 'trending' ? 'page' : null}">트렌딩</a>
        </nav>
    </div>
    <p th:if="${tab == 'trending'}" class="help">최근 7일 동안 반응이 많은 글 · 10분마다 갱신</p>
    <p th:if="${snapshotExpired}" class="notice" role="status">순위가 새로 바뀌었어요</p>
    <p th:if="${continued}"><a th:href="${tab == 'trending' ? '/?tab=trending' : '/'}">처음부터 보기</a></p>
    <th:block th:if="${tab == 'trending' and cards.isEmpty() and !continued}">
        <div class="empty-state">아직 트렌딩 글이 없어요 <a href="/">최신 글 보기</a></div>
    </th:block>
    <th:block th:if="${tab == 'latest' and cards.isEmpty() and !continued}">
        <div class="empty-state">아직 올라온 글이 없어요. 첫 글의 주인공이 되어 보세요
            <th:block th:if="${currentMemberId != null}">
                <form method="post" action="/write" class="inline-form">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">글쓰기</button>
                </form>
            </th:block>
            <a th:unless="${currentMemberId != null}" href="/login">로그인</a>
        </div>
    </th:block>
    <!-- 036 강성찬 개인 확장: 새로 온 작가와 그 첫 글 -->
    <section th:if="${newcomers != null and !newcomers.isEmpty()}" class="newcomers" aria-labelledby="newcomers-heading">
        <h2 id="newcomers-heading">새로 온 작가 <span class="help">첫 글을 반겨 주세요</span></h2>
        <ul class="newcomer-list">
            <li th:each="n : ${newcomers}" class="newcomer">
                <a th:href="${paths.blog(n.handle())}" class="newcomer-who">
                    <th:block th:replace="~{fragments/avatar :: avatar(${n.avatar()}, 36)}"></th:block>
                    <span th:text="${n.nickname()}">닉네임</span></a>
                <a th:href="${n.url()}" class="newcomer-post" th:text="${'첫 글 · ' + n.title()}">첫 글</a>
            </li>
        </ul>
    </section>
    <div class="card-grid home-cards" id="card-grid">
        <th:block th:each="card : ${cards}">
            <article th:replace="~{fragments/post-card :: card(${card}, ${cardDates.get(card.id())}, true)}"></article>
        </th:block>
    </div>
    <div th:replace="~{fragments/post-card :: moreWith(${nextCursor}, ${listApi}, true, ${!cards.isEmpty()}, ${moreLinkBase}, ${tab == 'trending' ? '/?tab=trending&expired=1' : null})}"></div>
    </div>
    <!-- 오른쪽: 인기 태그, 고양이 카드 -->
    <!-- 오른쪽(넓은 화면은 화면에 붙어 따라옴, 067 후속): 고양이 카드, 추천 블로그, 인기 태그, 사이트 링크 -->
    <aside class="home-side" aria-label="둘러보기">
        <section class="side-box side-cat" aria-label="글그린 한마디">
            <p class="side-cat-text">좋은 글은<br>언제나<br>마음에 남아요 <th:block th:replace="~{fragments/icons :: paw}"></th:block></p>
            <img th:src="@{/images/sleeping-cat.jpg}" alt="" width="880" height="641" loading="lazy">
        </section>
        <section th:if="${!recommended.isEmpty()}" class="side-box side-recommended" aria-labelledby="side-rec-heading">
            <h2 id="side-rec-heading">추천 블로그</h2>
            <ul class="side-rec-list">
                <li th:each="b : ${recommended}">
                    <a th:href="${paths.blog(b.handle())}" class="newcomer-who">
                        <th:block th:replace="~{fragments/avatar :: avatar(${b.avatar()}, 28)}"></th:block>
                        <span th:text="${b.nickname()}">닉네임</span></a>
                    <th:block th:replace="~{fragments/follow :: button(${b.handle()}, false, ${currentMemberId != null}, '/login', '/')}"></th:block>
                </li>
            </ul>
            <p class="follow-message help" role="status" hidden></p>
        </section>
        <section th:if="${!popularTags.isEmpty()}" class="side-box" aria-labelledby="side-tags-heading">
            <h2 id="side-tags-heading"><th:block th:replace="~{fragments/icons :: tag}"></th:block> 인기 태그</h2>
            <ul class="tag-pills side-pills">
                <li th:each="t : ${popularTags}"><a th:replace="~{fragments/tag-pill :: pill(${t.name()}, ${t.postCount()}, ${tagStyles.get(t.name())})}"></a></li>
            </ul>
        </section>
        <!-- 067 후속(강성찬 개인 확장): 목록이 끝없이 이어지므로 꼬리말 링크를 여기에도 -->
        <nav class="side-links" aria-label="사이트 정보">
            <a href="/terms">이용약관</a> <a href="/privacy">개인정보 처리방침</a> <a href="/releases">릴리스 노트</a>
            <a th:if="${contactEmail != null}" th:href="${'mailto:' + contactEmail}">문의하기</a>
        </nav>
    </aside>
    </div>
    <script th:src="@{/js/post/list-more.js}" defer></script>
    <script th:src="@{/js/post/drag-scroll.js}" defer></script>
    <script th:src="@{/js/post/home-tabs.js}" defer></script>
    <script th:src="@{/js/follow/follow.js}" defer></script>
</main>
</body>
</html>
