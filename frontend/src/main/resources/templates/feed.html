<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>피드</title>
</head>
<body>
<!-- 086 강성찬 개인 확장: 피드는 팔로우한 사람 글만. 추천 블로그·추천 글은 탐색으로 옮겼다 -->
<main class="list-page">
    <h1>피드</h1>
    <p th:if="${continued}"><a href="/feed">처음부터 보기</a></p>
    <th:block th:if="${cards.isEmpty() and !continued}">
        <div class="empty-state" th:unless="${followsAnyone}">팔로우한 사람이 없어요. 탐색에서 읽고 싶은 블로그를 찾아보세요 <a href="/explore">탐색</a></div>
        <div class="empty-state" th:if="${followsAnyone}">팔로우한 사람의 공개 글이 아직 없어요 <a href="/explore">탐색</a></div>
    </th:block>
    <div class="card-grid" id="card-grid">
        <th:block th:each="card : ${cards}">
            <article th:replace="~{fragments/post-card :: card(${card}, ${cardDates.get(card.id())}, true)}"></article>
        </th:block>
    </div>
    <div th:replace="~{fragments/post-card :: more(${nextCursor}, ${listApi}, true, ${!cards.isEmpty()})}"></div>
    <!-- 목록 끝(무한 스크롤이라 다 본 뒤에야 닿는다) -->
    <p th:if="${!cards.isEmpty()}" class="feed-end">팔로우한 글을 모두 보면 탐색에서 새 글을 찾아보세요 <a href="/explore" class="btn btn-sm">탐색</a></p>
    <script th:src="@{/js/post/list-more.js}" defer></script>
</main>
</body>
</html>
