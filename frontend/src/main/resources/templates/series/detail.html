<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${series.title()}">시리즈</title>
</head>
<body>
<main class="notes-page">
    <p class="help"><a th:href="${'/@' + owner.handle() + '/series'}" th:text="${owner.nickname() + '님의 시리즈'}">시리즈</a></p>
    <h1 th:text="${'📚 ' + series.title()}">시리즈</h1>
    <p th:if="${items.isEmpty()}" class="empty-state">아직 공개한 글이 없어요</p>
    <ol class="series-items">
        <li th:each="it : ${items}"><a th:href="${it.url()}" th:text="${it.title()}">글</a></li>
    </ol>
</main>
</body>
</html>
