<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${series.title() + ' · 글그린'}">시리즈</title>
</head>
<body>
<main class="notes-page list-page">
    <p class="help"><a th:href="${paths.blog(owner.handle()) + '/series'}" th:text="${owner.handle() + '님의 시리즈'}">시리즈</a></p>
    <h1 class="title-with-icon"><svg th:replace="~{fragments/icons :: i-book}"></svg> <span th:text="${series.title()}">시리즈</span></h1>
    <p class="help" th:unless="${cards.isEmpty()}" th:text="${'글 ' + cards.size() + '편 · 앞에서부터 차례대로 읽어 보세요'}">글 3편</p>
    <!-- 105 강성찬 개인 확장: 처음부터 읽을지 최신 글부터 볼지. 주인은 [순서 바꾸기]로 편 순서를 고친다 -->
    <div th:if="${cards.size() > 1}" class="home-tabs-row">
        <nav class="manage-tabs tags-sort" aria-label="정렬" th:unless="${editing}">
            <a href="?order=first" th:attr="aria-current=${order == 'first' ? 'page' : null}">1편부터</a>
            <a href="?order=latest" th:attr="aria-current=${order == 'latest' ? 'page' : null}">최신 글부터</a>
        </nav>
        <p th:if="${editing}" class="help">앞으로·뒤로로 편 순서를 바꿔요</p>
        <a th:if="${isOwner}" class="btn btn-sm" th:href="${editing ? '?' : '?edit=1'}" th:text="${editing ? '완료' : '순서 바꾸기'}">순서 바꾸기</a>
    </div>
    <p th:if="${cards.isEmpty()}" class="empty-state">아직 공개한 글이 없어요</p>
    <!-- 067 후속(강성찬 개인 확장): 홈과 같은 카드, 순서는 "N편" 배지. 105: 정렬 버튼, 앞으로·뒤로는 주인의 [순서 바꾸기] 안에만 -->
    <ol class="series-cards card-grid home-cards">
        <li th:each="card, st : ${cards}">
            <article th:replace="~{fragments/post-card :: cardWith(${card}, ${cardDates.get(card.id())}, false, ~{series/detail :: seriesExtra})}"></article>
        </li>
    </ol>
</main>
<th:block th:fragment="seriesExtra"><div class="manage-badges"><span class="badge" th:text="${(order == 'latest' ? total - st.index : st.count) + '편'}">1편</span>
    <th:block th:if="${editing}">
        <form class="inline-form" method="post" th:action="${paths.blog(owner.handle()) + '/series/' + series.id() + '/move'}" th:unless="${st.first}">
            <input type="hidden" name="postId" th:value="${card.id()}"><input type="hidden" name="dir" value="up">
            <button type="submit" class="btn btn-sm" th:attr="aria-label=${card.title() + ' 앞으로'}">앞으로</button>
        </form>
        <form class="inline-form" method="post" th:action="${paths.blog(owner.handle()) + '/series/' + series.id() + '/move'}" th:unless="${st.last}">
            <input type="hidden" name="postId" th:value="${card.id()}"><input type="hidden" name="dir" value="down">
            <button type="submit" class="btn btn-sm" th:attr="aria-label=${card.title() + ' 뒤로'}">뒤로</button>
        </form>
    </th:block></div></th:block>
</body>
</html>
