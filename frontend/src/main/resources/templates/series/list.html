<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${owner.handle() + '님의 시리즈' + ' · 글그린'}">시리즈</title>
</head>
<body>
<!-- 100 강성찬 개인 확장: 블로그의 시리즈 탭(머리말·탭은 홈과 같이) -->
<main class="list-page">
    <th:block th:replace="~{fragments/blog-header :: header}"></th:block>
    <div th:if="${seriesList.isEmpty()}" class="empty-state">
        <p>아직 묶어 둔 시리즈가 없어요</p>
        <p class="help" th:if="${isOwner}"><a href="/manage/series">내 글 관리의 시리즈 탭</a>이나 글쓰기 발행 설정에서 이어지는 글을 하나로 묶을 수 있어요</p>
    </div>
    <ul th:replace="~{series/list :: seriesCards(${seriesList})}"></ul>
    <script th:src="@{/js/follow/follow.js}" defer></script>
</main>
<!-- 시리즈 카드 목록(시리즈 탭·홈 선반) -->
<ul th:fragment="seriesCards(items)" class="series-list" th:unless="${items.isEmpty()}">
    <li th:each="s : ${items}" class="series-card">
        <a th:href="${paths.blog(owner.handle()) + '/series/' + s.id()}">
            <svg th:replace="~{fragments/icons :: i-book}"></svg>
            <strong th:text="${s.title()}">시리즈</strong>
            <span class="help" th:text="${'글 ' + s.postCount() + '편'}">글 3편</span>
        </a>
    </li>
</ul>
</body>
</html>
