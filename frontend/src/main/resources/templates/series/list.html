<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${owner.handle() + '님의 시리즈' + ' · 글그린'}">시리즈</title>
</head>
<body>
<!-- 100 강성찬 개인 확장: 블로그의 시리즈 탭(머리말·탭은 홈과 같이) -->
<main class="list-page">
    <th:block th:replace="~{fragments/blog-header :: header}"></th:block>
    <div th:if="${seriesList.isEmpty()}" class="empty-state">
        <p>아직 묶어 둔 시리즈가 없어요</p>
        <p class="help" th:if="${isOwner}">오른쪽 위 [시리즈 추가]나 글쓰기의 발행 설정에서 이어지는 글을 하나로 묶을 수 있어요</p>
    </div>
    <ul th:replace="~{series/list :: seriesCards(${seriesList})}"></ul>
    <script th:src="@{/js/follow/follow.js}" defer></script>
</main>
<!-- 시리즈 카드 목록(시리즈 탭·홈 선반) -->
<ul th:fragment="seriesCards(items)" class="series-list" th:unless="${items.isEmpty()}">
    <th:block th:each="s : ${items}"><li th:replace="~{series/list :: seriesCard(${paths.blog(owner.handle()) + '/series/' + s.id()}, ${s}, ${s.meta()})}"></li></th:block>
</ul>
<!-- 107 강성찬 개인 확장: 시리즈 카드 한 장(대표 사진·이름·설명 한 줄·글 수). 블로그 시리즈 탭·홈 선반·탐색 시리즈 탭이 같이 쓴다 -->
<li th:fragment="seriesCard(href, s, meta)" class="series-card">
    <a th:href="${href}">
        <img th:if="${s.coverUrl() != null}" class="series-cover" th:src="${s.coverUrl()}" alt="" loading="lazy">
        <span th:unless="${s.coverUrl() != null}" class="series-cover series-cover-empty"><svg th:replace="~{fragments/icons :: i-book}"></svg></span>
        <span class="series-card-text">
            <strong th:text="${s.title()}">시리즈</strong>
            <span th:if="${s.description() != null}" class="series-card-desc" th:text="${s.description()}">설명</span>
            <span class="help"><th:block th:replace="~{fragments/meta :: parts(${meta})}"></th:block></span>
        </span>
    </a>
</li>
<!-- 114 강성찬 개인 확장: 탐색 시리즈 탭 한 줄(목록형). 표지가 모두 같은 베이지라 표지만으로는 구별이 안 돼서,
     이름·설명 아래에 앞 세 편 제목을 한 줄로 보여 무엇을 담았는지 먼저 알린다. 오른쪽은 글 수 -->
<li th:fragment="browseRow(s)" class="series-row">
    <a th:href="${s.url()}">
        <img th:if="${s.coverUrl() != null}" class="sr-cover" th:src="${s.coverUrl()}" alt="" loading="lazy">
        <span th:unless="${s.coverUrl() != null}" class="sr-cover sr-blank" aria-hidden="true"><span th:text="${s.title()}">시리즈</span></span>
        <span class="sr-body">
            <strong class="sr-title" th:text="${s.title()}">시리즈</strong>
            <span th:if="${s.description() != null}" class="sr-desc" th:text="${s.description()}">설명</span>
            <span th:unless="${s.peek().isEmpty()}" class="sr-peek"><th:block th:each="p, st : ${s.peek()}"><span class="sr-no" th:text="${st.count}">1</span>&nbsp;<th:block th:text="${p.title()}">글</th:block><th:block th:unless="${st.last}"> · </th:block></th:block></span>
            <span class="sr-foot"><th:block th:text="${s.handle()}"></th:block><th:block th:if="${s.latestLabel() != null and !s.latestLabel().isEmpty()}"> · <th:block th:text="${s.latestLabel()}"></th:block><span class="sr-upd"> 업데이트</span></th:block></span>
        </span>
        <span class="sr-count"><b th:text="${s.postCount()}">5</b>편</span>
    </a>
</li>
</body>
</html>
