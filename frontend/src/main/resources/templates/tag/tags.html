<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>태그</title>
</head>
<body>
<main class="list-page tags-page">
    <!-- 056 강성찬 개인 확장(10-12 시안): 태그 배너 -->
    <section class="tags-hero" aria-labelledby="tags-title">
        <div class="tags-hero-text">
            <h1 id="tags-title"><th:block th:replace="~{fragments/icons :: paw}"></th:block> 태그
                <span class="tags-hero-paw"><th:block th:replace="~{fragments/icons :: paw}"></th:block></span></h1>
            <p>관심 있는 주제를 태그로 찾아보세요.<br>다양한 사람들의 글이 기다리고 있어요.</p>
        </div>
        <img class="tags-hero-art" src="/images/sleeping-cat.jpg" alt="" width="880" height="641">
    </section>
    <section class="tags-box" aria-labelledby="tags-box-title">
        <div class="tags-box-head">
            <h2 id="tags-box-title"><th:block th:replace="~{fragments/icons :: tag}"></th:block> 인기 태그
                <span class="count-chip" th:text="${'전체 ' + tagTotal + '개'}">전체 28개</span></h2>
            <details class="sort-menu">
                <summary th:text="${sort == 'views' ? '많이 본 순' : sort == 'name' ? '이름 순' : '글 많은 순'}">글 많은 순</summary>
                <div class="sort-menu-panel">
                    <a href="/tags" th:attr="aria-current=${sort == 'posts' ? 'true' : null}">글 많은 순</a>
                    <a href="/tags?sort=views" th:attr="aria-current=${sort == 'views' ? 'true' : null}">많이 본 순</a>
                    <a href="/tags?sort=name" th:attr="aria-current=${sort == 'name' ? 'true' : null}">이름 순</a>
                </div>
            </details>
        </div>
        <p th:if="${tags.isEmpty()}" class="empty-state">아직 공개된 글에 쓰인 태그가 없어요</p>
        <ul class="tag-pills">
            <li th:each="t : ${tags}"><a th:replace="~{fragments/tag-pill :: pill(${t.name()}, ${t.postCount()}, ${tagStyles.get(t.name())})}"></a></li>
        </ul>
    </section>
</main>
</body>
</html>
