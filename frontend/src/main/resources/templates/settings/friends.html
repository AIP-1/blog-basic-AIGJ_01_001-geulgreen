<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>친구</title>
</head>
<body>
<main class="friends-page">
    <h1>친구</h1>
    <p class="help">나를 팔로우하는 사람 중에서 친구를 골라 넣어요. 친구 공개 글은 나와 내가 넣은 친구만 볼 수 있어요.
        넣고 빼도 상대에게 알리지 않고, 목록은 나만 볼 수 있어요.
        <a href="/settings/groups">친구 그룹</a> · <a href="/settings">설정으로</a></p>

    <section aria-labelledby="friends-heading">
        <h2 id="friends-heading" th:text="${'내 친구 ' + friends.size()}">내 친구 0</h2>
        <p th:if="${friends.isEmpty()}" class="help">아직 친구가 없어요. 아래 나를 팔로우하는 사람 중에서 넣어 보세요</p>
        <ul class="follow-list">
            <li th:each="m : ${friends}" class="follow-row">
                <th:block th:replace="~{fragments/avatar :: avatar(${m.avatar()}, 40)}"></th:block>
                <div class="follow-text"><p><span th:text="${m.nickname()}">닉네임</span>
                    <a th:href="${'/@' + m.handle()}" th:text="${'@' + m.handle()}">@주소</a></p></div>
                <th:block th:replace="~{fragments/friend :: button(${m.handle()}, 'FRIENDS', '/settings/friends')}"></th:block>
            </li>
        </ul>
    </section>

    <section aria-labelledby="candidates-heading">
        <h2 id="candidates-heading" th:text="${'나를 팔로우하는 사람 ' + candidates.size()}">나를 팔로우하는 사람 0</h2>
        <p th:if="${candidates.isEmpty()}" class="help">친구로 넣을 수 있는 사람이 없어요</p>
        <ul class="follow-list">
            <li th:each="m : ${candidates}" class="follow-row">
                <th:block th:replace="~{fragments/avatar :: avatar(${m.avatar()}, 40)}"></th:block>
                <div class="follow-text"><p><span th:text="${m.nickname()}">닉네임</span>
                    <a th:href="${'/@' + m.handle()}" th:text="${'@' + m.handle()}">@주소</a></p></div>
                <th:block th:replace="~{fragments/friend :: button(${m.handle()}, 'FOLLOWER', '/settings/friends')}"></th:block>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
