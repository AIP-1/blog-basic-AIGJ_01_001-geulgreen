<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>카테고리 · 글그린</title>
</head>
<body>
<main class="friends-page">
    <h1>카테고리</h1>
    <p class="help">내 블로그 글을 주제별로 나눠요. 글 화면에서 글마다 카테고리를 하나 고를 수 있어요.
        카테고리를 지워도 글은 그대로 남고 "분류 없음"이 돼요. <a href="/settings">설정으로</a></p>
    <form method="post" action="/settings/categories" class="group-create">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="category-name">새 카테고리</label>
        <input id="category-name" name="name" type="text" maxlength="30" required placeholder="예: 개발, 일상, 여행">
        <button type="submit" class="btn btn-primary btn-sm">만들기</button>
    </form>
    <p th:if="${categories.isEmpty()}" class="help">아직 카테고리가 없어요</p>
    <ul class="follow-list category-list">
        <li th:each="c, st : ${categories}" class="follow-row">
            <form method="post" th:action="@{/settings/categories/{id}/rename(id=${c.id()})}" class="inline-form">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label th:for="${'cat-' + c.id()}" class="visually-hidden">카테고리 이름</label>
                <input th:id="${'cat-' + c.id()}" name="name" type="text" maxlength="30" required th:value="${c.name()}">
                <span class="help" th:text="${'공개 글 ' + c.postCount()}">공개 글 3</span>
                <button type="submit" class="btn btn-sm">이름 바꾸기</button>
            </form>
            <form method="post" th:action="@{/settings/categories/{id}/move(id=${c.id()})}" class="inline-form">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" name="dir" value="up" class="btn btn-sm" th:disabled="${st.first}" aria-label="위로">▲</button>
                <button type="submit" name="dir" value="down" class="btn btn-sm" th:disabled="${st.last}" aria-label="아래로">▼</button>
            </form>
            <form method="post" th:action="@{/settings/categories/{id}/delete(id=${c.id()})}" class="inline-form">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm">지우기</button>
            </form>
        </li>
    </ul>
</main>
</body>
</html>
