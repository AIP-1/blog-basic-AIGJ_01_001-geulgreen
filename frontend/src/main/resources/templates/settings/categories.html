<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>카테고리 · 글그린</title>
</head>
<body>
<!--/* 10-25: 설정 본 화면과 같은 카드형. 줄 하나 = 카테고리 하나(이름 칸 · 공개 글 수 · 순서 · 지우기) */-->
<main class="set-page">
    <a class="set-back" href="/settings#settings-blog"><svg th:replace="~{fragments/icons :: chevron-left}"></svg>설정 · 블로그·화면</a>
    <header class="set-head">
        <h1>카테고리</h1>
        <p class="set-lead">내 블로그 글을 주제별로 나눠요. 글마다 카테고리를 하나 고를 수 있어요.</p>
    </header>

    <section class="set-card" aria-labelledby="category-new-heading">
        <h2 class="set-card-title" id="category-new-heading">새 카테고리</h2>
        <form method="post" action="/settings/categories" class="set-inline">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="category-name" class="visually-hidden">새 카테고리</label>
            <input id="category-name" name="name" type="text" maxlength="30" required placeholder="예: 개발, 일상, 여행">
            <button type="submit" class="btn btn-primary btn-sm">만들기</button>
        </form>
    </section>

    <section class="set-card" aria-labelledby="category-list-heading">
        <h2 class="set-card-title" id="category-list-heading" th:text="${'내 카테고리 ' + categories.size()}">내 카테고리 0</h2>
        <div th:if="${categories.isEmpty()}" class="set-empty">
            <svg th:replace="~{fragments/icons :: folder}"></svg>
            <p class="set-label">아직 카테고리가 없어요</p>
            <p class="set-desc">위에서 하나 만들어 보세요.</p>
        </div>
        <ul class="set-list category-list" th:unless="${categories.isEmpty()}">
            <li th:each="c, st : ${categories}" class="set-row set-category">
                <form method="post" th:action="@{/settings/categories/{id}/rename(id=${c.id()})}" class="set-category-name">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label th:for="${'cat-' + c.id()}" class="visually-hidden">카테고리 이름</label>
                    <input th:id="${'cat-' + c.id()}" name="name" type="text" maxlength="30" required th:value="${c.name()}">
                    <span class="set-count-chip" th:text="${'공개 글 ' + c.postCount()}">공개 글 3</span>
                    <button type="submit" class="btn btn-sm btn-quiet">이름 저장</button>
                </form>
                <div class="set-row-actions">
                    <form method="post" th:action="@{/settings/categories/{id}/move(id=${c.id()})}" class="set-order">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" name="dir" value="up" class="btn btn-sm btn-icon" th:disabled="${st.first}" aria-label="위로"><svg th:replace="~{fragments/icons :: arrow-up}"></svg></button>
                        <button type="submit" name="dir" value="down" class="btn btn-sm btn-icon" th:disabled="${st.last}" aria-label="아래로"><svg th:replace="~{fragments/icons :: arrow-down}"></svg></button>
                    </form>
                    <form method="post" th:action="@{/settings/categories/{id}/delete(id=${c.id()})}">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-sm btn-icon set-danger-text" th:attr="aria-label=${c.name() + ' 지우기'}"><svg th:replace="~{fragments/icons :: trash}"></svg></button>
                    </form>
                </div>
            </li>
        </ul>
        <p class="set-desc set-foot">카테고리를 지워도 글은 그대로 남고 "분류 없음"이 돼요.</p>
    </section>
</main>
</body>
</html>
