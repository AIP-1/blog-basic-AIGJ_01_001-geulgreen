<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>회원 탈퇴 · 글그린</title>
</head>
<body>
<!--/* 10-25: 설정 본 화면과 같은 카드형. ① 안내 카드(화면을 열 때 계산) ② 본인 확인 카드 → [탈퇴하기]. 사유는 묻지 않는다 */-->
<main class="set-page">
    <a class="set-back" href="/settings#settings-account"><svg th:replace="~{fragments/icons :: chevron-left}"></svg>설정 · 계정</a>
    <header class="set-head">
        <h1>회원 탈퇴</h1>
        <p class="set-lead">탈퇴하기 전에 아래 내용을 꼭 읽어 주세요.</p>
    </header>

    <section class="set-card" aria-labelledby="withdraw-info">
        <h2 class="set-card-title" id="withdraw-info">탈퇴하면</h2>
        <ul class="set-list set-warn">
            <li class="set-row set-bullet"><svg th:replace="~{fragments/icons :: close}"></svg><span><span th:text="${'블로그 주소 @' + overview.handle()}">블로그 주소</span>와 모든 글이 바로 다른 사람에게 보이지 않아요.</span></li>
            <li class="set-row set-bullet"><svg th:replace="~{fragments/icons :: close}"></svg><span th:text="${'내 글 ' + overview.postCount() + '개(휴지통 포함), 남의 글에 쓴 댓글 ' + overview.commentCount() + '개, 받은 좋아요 ' + overview.likesReceived() + '개'}">내 글 수</span></li>
            <li class="set-row set-bullet is-ok"><svg th:replace="~{fragments/icons :: restore}"></svg><span th:text="${deadline + '까지 로그인하면 복구할 수 있어요.'}">복구 기한</span></li>
            <li class="set-row set-bullet"><svg th:replace="~{fragments/icons :: close}"></svg><span>그 뒤에는 글·사진·좋아요가 완전히 삭제되고 되돌릴 수 없어요.</span></li>
            <li class="set-row set-bullet"><svg th:replace="~{fragments/icons :: close}"></svg><span>답글이 달린 댓글은 내용 없이 자리만 남아요.</span></li>
            <li class="set-row set-bullet"><svg th:replace="~{fragments/icons :: close}"></svg><span>블로그 주소는 다른 사람도, 나도 다시 쓸 수 없어요.</span></li>
        </ul>
    </section>

    <section class="set-card" aria-labelledby="withdraw-confirm-heading">
        <h2 class="set-card-title" id="withdraw-confirm-heading">본인 확인</h2>
        <form method="post" action="/settings/withdraw" id="withdraw-form">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="set-row set-check">
                <input type="checkbox" name="confirm" id="withdraw-confirm" value="on">
                <span class="set-label">위 내용을 확인했어요</span>
            </label>
            <p class="field-error" data-error-for="confirm" role="alert"></p>
            <div class="set-field" th:if="${overview.passwordAccount()}">
                <label for="withdraw-verification">현재 비밀번호</label>
                <input type="password" id="withdraw-verification" name="verification" autocomplete="current-password">
            </div>
            <div class="set-field" th:unless="${overview.passwordAccount()}">
                <label for="withdraw-verification">확인을 위해 "탈퇴"를 입력해 주세요</label>
                <input type="text" id="withdraw-verification" name="verification" autocomplete="off">
            </div>
            <p class="field-error" data-error-for="verification" role="alert"></p>
            <div class="set-actions">
                <a class="set-btn-link" href="/settings#settings-account">취소</a>
                <button type="submit" id="withdraw-submit" disabled class="btn set-btn-danger">탈퇴하기</button>
            </div>
        </form>
    </section>
    <script th:src="@{/js/account/withdraw.js}" defer></script>
</main>
</body>
</html>
