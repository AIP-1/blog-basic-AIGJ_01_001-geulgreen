<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>비공개 계정</title>
</head>
<body>
<!-- 073 강성찬 개인 확장: 비공개 계정 켜기·끄기와 받은 팔로우 요청 -->
<main class="friends-page">
    <h1>비공개 계정</h1>
    <p class="help">비공개 계정은 내가 팔로우 요청을 수락한 사람만 내 글·짧은 기록·방명록·팔로워 목록을 볼 수 있어요.
        다른 사람에게는 프로필 윗부분만 보이고, 홈·트렌딩·태그·검색·RSS에도 내 글이 나오지 않아요. 지금 팔로워는 그대로예요.
        <a href="/settings">설정으로</a></p>

    <form method="post" action="/settings/privacy" class="privacy-form">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <p th:text="${isPrivate ? '지금은 🔒 비공개 계정이에요' : '지금은 공개 계정이에요'}">지금은 공개 계정이에요</p>
        <button type="submit" name="private" th:value="${!isPrivate}" class="btn"
                th:text="${isPrivate ? '공개 계정으로 바꾸기(대기 중 요청은 모두 수락)' : '비공개 계정으로 바꾸기'}">비공개 계정으로 바꾸기</button>
    </form>

    <section aria-labelledby="requests-heading">
        <h2 id="requests-heading" th:text="${'받은 팔로우 요청 ' + requests.size()}">받은 팔로우 요청 0</h2>
        <p th:if="${requests.isEmpty()}" class="help">받은 요청이 없어요</p>
        <ul class="follow-list">
            <li th:each="m : ${requests}" class="follow-row">
                <th:block th:replace="~{fragments/avatar :: avatar(${m.avatar()}, 40)}"></th:block>
                <div class="follow-text"><p><span th:text="${m.nickname()}">닉네임</span>
                    <a th:href="${'/@' + m.handle()}" th:text="${'@' + m.handle()}">@주소</a></p></div>
                <form method="post" th:action="${'/settings/privacy/requests/' + m.handle()}" class="friend-form">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" name="action" value="accept" class="btn btn-primary btn-sm">수락</button>
                    <button type="submit" name="action" value="decline" class="btn-text btn-sm">거절</button>
                </form>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
