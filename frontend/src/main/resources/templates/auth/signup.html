<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>이메일로 가입하기 · 글그린</title>
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-art"><th:block th:replace="~{fragments/icons :: cat}"></th:block></div>
    <div class="auth-panel">
    <h1>이메일로 가입하기</h1>
    <p class="auth-lead">글그린에서 나만의 블로그를 시작해 보세요.</p>

    <form method="post" th:action="@{/signup}" novalidate class="auth-form">

        <div class="field">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required
                   th:value="${form.email}">
            <p class="field-error" id="email-error" th:if="${errors['email'] != null}" role="alert">
                <span th:text="${errors['email']}">오류</span>
                <span th:if="${emailDuplicate}"><a href="/login">[로그인]</a> <a href="/password/forgot">[비밀번호 찾기]</a></span>
            </p>
        </div>

        <!-- 074 강성찬 개인 확장: 인스타처럼 이메일 → 6자리 코드 확인 → 나머지 칸 -->
        <div class="field signup-code" th:if="${instaSignup}" data-signup-code
             th:attr="data-verified=${codeVerifiedEmail != null}">
            <button type="button" class="btn btn-sm" data-code-send>인증 코드 받기</button>
            <div data-code-entry hidden>
                <label for="email-code">메일로 받은 6자리 코드</label>
                <input id="email-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
                <button type="button" class="btn btn-sm" data-code-verify>확인</button>
                <p class="help">메일이 안 보이면 스팸함도 확인해 주세요</p>
            </div>
            <p class="availability" data-code-status aria-live="polite"
               th:text="${codeVerifiedEmail != null} ? '이메일을 확인했어요' : ''"></p>
        </div>

        <div data-signup-rest>
        <div class="field">
            <label for="nickname">닉네임</label>
            <input id="nickname" name="nickname" type="text" maxlength="30" required autocomplete="nickname"
                   data-availability="nickname" data-availability-target="#nickname-status"
                   th:value="${form.nickname}" aria-describedby="nickname-status">
            <p id="nickname-status" class="availability" aria-live="polite"></p>
            <p class="field-error" th:if="${errors['nickname'] != null}" th:text="${errors['nickname']}" role="alert"></p>
        </div>

        <div class="field">
            <label for="handle">블로그 주소</label>
            <div class="handle-input">
                <span aria-hidden="true" th:text="${siteHost + '/'}">blog.example.com/</span>
                <input id="handle" name="handle" type="text" required maxlength="36"
                       data-handle-field data-email-source="#email"
                       data-availability="handle" data-availability-target="#handle-status"
                       inputmode="latin" autocapitalize="off" autocomplete="off" spellcheck="false" lang="en"
                       th:value="${form.handle}" aria-describedby="handle-help handle-status">
            </div>
            <p id="handle-help" class="help" th:text="${instaSignup} ? '이메일 앞부분으로 채웠어요. 가입 후 설정에서 14일에 두 번까지 바꿀 수 있어요.' : '이메일 앞부분으로 채웠어요. ⚠ 가입 후에는 바꿀 수 없어요.'">이메일 앞부분으로 채웠어요.</p>
            <p id="handle-status" class="availability" aria-live="polite"></p>
            <p class="field-error" th:if="${errors['handle'] != null}" role="alert">
                <span th:text="${errors['handle']}">오류</span>
                <button type="button" class="handle-suggestion" th:if="${handleSuggestion != null}"
                        th:attr="data-fill-handle=${handleSuggestion}"
                        th:text="${handleSuggestion} + '는 어떠세요?'">대안</button>
            </p>
        </div>

        <div class="field signup-password">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required
                   placeholder="8~16자, 영문·숫자·특수문자"
                   data-password-rules="#password-rules" data-email-source="#email">
            <ul id="password-rules" class="password-rules" aria-live="polite">
                <li data-rule="length">8~16자 (최대 16자)</li>
                <li data-rule="letter">영문 1자 이상</li>
                <li data-rule="digit">숫자 1자 이상</li>
                <li data-rule="special">특수문자 1자 이상</li>
                <li data-rule="allowed">영문·숫자·특수문자만 (공백·한글 불가)</li>
                <li data-rule="email">이메일 앞부분을 넣지 않기</li>
            </ul>
            <ul class="field-error" th:if="${!passwordErrors.isEmpty()}" role="alert">
                <li th:each="msg : ${passwordErrors}" th:text="${msg}">오류</li>
            </ul>
        </div>

        <div class="field">
            <label for="passwordConfirm">비밀번호 확인</label>
            <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required>
            <p class="field-error" th:if="${errors['passwordConfirm'] != null}" th:text="${errors['passwordConfirm']}" role="alert"></p>
        </div>

        <fieldset class="field signup-agree">
            <legend>약관 동의 (필수)</legend>
            <p class="form-error" th:if="${errors['agreements'] != null}" th:text="${errors['agreements']}" role="alert" data-toast-inline></p>
            <label class="agree-all"><input type="checkbox" data-agree-all> 모두 동의해요</label>
            <label><input type="checkbox" name="agreeTerms" value="true" th:checked="${form.agreeTerms}"> 이용약관에 동의해요 (필수) <a href="/terms" target="_blank" rel="noopener">약관 보기</a></label>
            <label><input type="checkbox" name="agreePrivacy" value="true" th:checked="${form.agreePrivacy}"> 개인정보 수집·이용에 동의해요 (필수) <a href="/privacy" target="_blank" rel="noopener">처리방침 보기</a></label>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block">가입하기</button>
        </div>
    </form>
    <!-- 074: 소셜 가입도 같은 카드에서 -->
    <th:block th:if="${instaSignup}">
    <p class="auth-divider"><span>또는</span></p>
    <div class="social-login">
        <a class="btn btn-social" href="/oauth2/authorization/google"><th:block th:replace="~{fragments/icons :: google}"></th:block>Google로 계속하기</a>
        <a class="btn btn-social" href="/oauth2/authorization/github"><th:block th:replace="~{fragments/icons :: github}"></th:block>GitHub로 계속하기</a>
    </div>
    </th:block>
    <p class="auth-links">이미 계정이 있나요? <a href="/login">로그인</a></p>
    </div>
  </div>

    <script th:src="@{/js/account/availability.js}" defer></script>
    <script th:src="@{/js/account/handle-field.js}" defer></script>
    <script th:src="@{/js/auth/password-rules.js}" defer></script>
    <script th:src="@{/js/auth/signup-form.js}" defer></script>
    <script th:if="${instaSignup}" th:src="@{/js/auth/signup-code.js}" defer></script>
</main>
</body>
</html>
