<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>로그인 · 글그린</title>
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-art"><th:block th:replace="~{fragments/icons :: cat}"></th:block></div>
    <div class="auth-panel">
    <h1>다시 와줘서 반가워요!</h1>
    <p class="auth-lead">글그린에서 새로운 이야기를 읽어 보세요.</p>
    <p class="notice" th:if="${notice != null}" th:text="${notice}" role="status" data-toast>알림</p>
    <p class="form-error" th:if="${message != null}" th:text="${message}" role="alert" data-toast>오류</p>

    <form method="post" th:action="@{/login}" class="auth-form">
        <input type="hidden" name="redirect" th:if="${redirect != null}" th:value="${redirect}">
        <div class="field">
            <!-- 074 강성찬 개인 확장: 이메일 또는 블로그 주소(아이디)로 로그인 -->
            <label for="email" th:text="${instaLogin} ? '이메일 또는 아이디' : '이메일'">이메일</label>
            <input id="email" name="email" th:type="${instaLogin} ? 'text' : 'email'" autocomplete="username" required maxlength="254"
                   autocapitalize="off" spellcheck="false"
                   th:placeholder="${instaLogin} ? '이메일 또는 아이디(블로그 주소)' : '이메일을 입력하세요'">
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="비밀번호를 입력하세요">
        </div>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
    </form>

    <p class="auth-divider"><span>또는</span></p>
    <div class="social-login">
        <a class="btn btn-social" href="/oauth2/authorization/google"><th:block th:replace="~{fragments/icons :: google}"></th:block>Google로 계속하기</a>
        <a class="btn btn-social" href="/oauth2/authorization/github"><th:block th:replace="~{fragments/icons :: github}"></th:block>GitHub로 계속하기</a>
    </div>
    <p class="auth-links">계정이 없나요? <a href="/signup">이메일로 가입하기</a><br><a class="link-btn" href="/password/forgot">비밀번호 찾기</a></p>
    </div>
  </div>
</main>
</body>
</html>
