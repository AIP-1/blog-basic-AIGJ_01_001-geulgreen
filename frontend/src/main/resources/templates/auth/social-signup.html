<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>가입 마무리 · 글그린</title>
</head>
<body>
<main class="auth-page auth-page-single">
    <h1 th:text="${providerName} + ' 계정으로 가입 마무리'">가입 마무리</h1>

    <section class="notice" th:if="${!sameEmailProviders.isEmpty()}" role="status" data-toast-inline>
        <p>이 이메일로 가입한 계정이 이미 있어요.
            <span class="help" th:text="'(' + ${#strings.listJoin(sameEmailProviders, ', ')} + ')'">(이메일)</span></p>
        <form method="post" th:action="@{/signup/social/cancel}" style="display:inline">
            <button type="submit">기존 계정으로 로그인</button>
        </form>
        <a href="#social-signup-form">새 계정 만들기</a>
    </section>

    <form id="social-signup-form" method="post" th:action="@{/signup/social}" novalidate class="auth-form">

        <div class="field" th:if="${needsEmail}">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required th:value="${form.email}">
            <p class="help">인증된 이메일을 받지 못했어요. 이메일을 입력하면 인증 메일을 보내 드려요.</p>
            <p class="field-error" th:if="${errors['email'] != null}" th:text="${errors['email']}" role="alert"></p>
        </div>

        <div class="field">
            <label for="nickname">닉네임</label>
            <input id="nickname" name="nickname" type="text" maxlength="30" required
                   data-availability="nickname" data-availability-target="#nickname-status"
                   th:value="${form.nickname}" aria-describedby="nickname-status">
            <p class="help" th:if="${nicknameHint != null}" th:text="${nicknameHint}">닉네임을 입력해 주세요</p>
            <p id="nickname-status" class="availability" aria-live="polite"></p>
            <p class="field-error" th:if="${errors['nickname'] != null}" th:text="${errors['nickname']}" role="alert"></p>
        </div>

        <!-- 003: 허용 호스트(HTTPS)의 소셜 사진만 256 크기로 미리보기. 가입 직후 브라우저가 우리 저장소로 복사한다 -->
        <div class="field profile-image-row" th:if="${pictureUrl != null}">
            <img class="avatar" th:src="${pictureUrl}" alt="" width="48" height="48" referrerpolicy="no-referrer"
                 style="width:48px;height:48px">
            <label><input type="checkbox" name="useSocialPicture" value="true" th:checked="${form.useSocialPicture}">
                <span th:text="${providerName} + ' 프로필 사진 사용'">프로필 사진 사용</span></label>
        </div>

        <!-- 10-21 chan: 나이 확인. 14세 미만은 보호자 이름·이메일을 받아 보호자 동의 메일을 보낸다(개인정보 보호법 제22조의2) -->
        <fieldset class="field signup-age" data-age-group>
            <legend>나이 (필수)</legend>
            <p class="form-error" th:if="${errors['guardian'] != null}" th:text="${errors['guardian']}" role="alert" data-toast-inline></p>
            <label><input type="radio" name="ageGroup" value="OVER14" required th:checked="${form.ageGroup() == 'OVER14'}"> 만 14세 이상이에요</label>
            <label><input type="radio" name="ageGroup" value="UNDER14" th:checked="${form.under14()}"> 만 14세 미만이에요</label>
            <div class="signup-guardian" data-guardian-fields th:hidden="${!form.under14()}">
                <p class="help">14세 미만은 보호자(부모님 등)의 동의가 있어야 가입할 수 있어요. 보호자에게 동의 메일을 보내고, 보호자가 동의하면 바로 쓸 수 있어요.</p>
                <label for="guardianName">보호자 이름</label>
                <input id="guardianName" name="guardianName" type="text" maxlength="30" autocomplete="off" th:value="${form.guardianName()}">
                <label for="guardianEmail">보호자 이메일</label>
                <input id="guardianEmail" name="guardianEmail" type="email" maxlength="254" autocomplete="off" th:value="${form.guardianEmail()}">
            </div>
        </fieldset>

        <fieldset class="field">
            <legend>약관 동의 (필수)</legend>
            <p class="form-error" th:if="${errors['agreements'] != null}" th:text="${errors['agreements']}" role="alert" data-toast-inline></p>
            <label><input type="checkbox" name="agreeTerms" value="true" th:checked="${form.agreeTerms}"> 이용약관에 동의해요 (필수)</label><br>
            <label><input type="checkbox" name="agreePrivacy" value="true" th:checked="${form.agreePrivacy}"> 개인정보 수집·이용에 동의해요 (필수)</label> <a href="/privacy" target="_blank" rel="noopener">처리방침 보기</a>
        </fieldset>

        <p class="form-error" th:if="${errors['handle'] != null}" role="alert" data-toast-inline><span th:text="${'블로그 주소를 만들지 못했어요: ' + errors['handle']}">오류</span><span
                th:if="${handleSuggestion != null and !#strings.contains(errors['handle'], handleSuggestion)}" th:text="${' ' + handleSuggestion + '는 쓸 수 있어요'}"> 대안</span></p>
        <button type="submit" class="btn btn-primary btn-block">가입 마치기</button>
        <!-- 10-25 chan: 주소 칸을 뺐다. 가입 방법 접두어(go-/gi-) + 이메일 앞부분으로 만들고 설정에서 바꾼다(SocialSignupService) -->
        <p class="help signup-handle-note" th:text="'블로그 주소는 ' + ${handlePrefix} + ' + 이메일 앞부분으로 만들어요. 가입 후 설정에서 바꿀 수 있어요.'">블로그 주소는 이메일 앞부분으로 만들어요.</p>
    </form>

    <script th:src="@{/js/account/availability.js}" defer></script>
    <script th:src="@{/js/auth/signup-form.js}" defer></script>
</main>
</body>
</html>
