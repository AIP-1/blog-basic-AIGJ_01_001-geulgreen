<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>비밀번호 찾기 · 글그린</title>
</head>
<body>
<main class="auth-page auth-page-single">
    <h1>비밀번호 찾기</h1>
    <p class="notice" th:if="${sent != null}" th:text="${sent}" role="status" data-toast>안내</p>
    <p class="form-error" th:if="${codeError != null}" th:text="${codeError}" role="alert" data-toast>오류</p>
    <!-- 074 강성찬 개인 확장: 메일로 받은 6자리 코드와 새 비밀번호를 여기서 바로 넣는다(링크도 그대로 쓸 수 있음) -->
    <form th:if="${codeEmail != null}" method="post" th:action="@{/password/reset-code}" class="auth-form" novalidate>
        <input type="hidden" name="email" th:value="${codeEmail}">
        <div class="field">
            <label for="code">메일로 받은 6자리 코드</label>
            <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                   pattern="[0-9]{6}" required>
            <p class="help">메일이 안 보이면 스팸함도 확인해 주세요</p>
        </div>
        <div class="field">
            <label for="password">새 비밀번호 <span class="help">(8~16자, 영문·숫자·특수문자)</span></label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>
            <ul class="field-error" th:if="${passwordErrors != null and !passwordErrors.isEmpty()}" role="alert">
                <li th:each="msg : ${passwordErrors}" th:text="${msg}">오류</li>
            </ul>
        </div>
        <div class="field">
            <label for="passwordConfirm">새 비밀번호 확인</label>
            <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">비밀번호 바꾸기</button>
    </form>
    <th:block th:if="${codeEmail == null}">
    <p>가입한 이메일을 입력하면 비밀번호를 다시 정할 수 있는 코드와 링크를 보내 드려요.</p>
    <form method="post" th:action="@{/password/forgot}" class="auth-form">
        <div class="field">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">안내 메일 받기</button>
    </form>
    </th:block>
    <p><a class="link-btn" href="/login">로그인</a></p>
</main>
</body>
</html>
