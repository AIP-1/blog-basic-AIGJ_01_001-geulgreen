<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${owner.handle() + '님의 방명록' + ' · 글그린'}">방명록</title>
</head>
<body>
<main class="notes-page guestbook-page">
    <h1 th:text="${'📖 ' + owner.handle() + '님의 방명록'}">방명록</h1>
    <p><a class="link-btn back" th:href="${paths.blog(owner.handle())}">블로그로 돌아가기</a></p>
    <form th:if="${currentMemberId != null}" method="post" th:action="${paths.blog(owner.handle()) + '/guestbook'}" class="note-form guestbook-form">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="guestbook-content" class="visually-hidden">방명록 남기기</label>
        <textarea id="guestbook-content" name="content" maxlength="300" rows="3" required placeholder="반가운 인사를 남겨 주세요 (300자)"></textarea>
        <div class="note-form-bar">
            <label><input type="checkbox" name="secret" value="on"> <svg th:replace="~{fragments/icons :: lock}"></svg> 비밀글 (블로그 주인과 나만 보기)</label>
            <button type="submit" class="btn btn-primary btn-sm">남기기</button>
        </div>
    </form>
    <p th:unless="${currentMemberId != null}" class="help"><a th:href="${loginRedirect}">로그인</a>하면 방명록을 남길 수 있어요</p>
    <p th:if="${entries.isEmpty()}" class="empty-state">아직 방명록이 없어요. 첫 인사를 남겨 보세요</p>
    <ul class="note-list" th:unless="${entries.isEmpty()}"><!-- 비었으면 테두리만 남은 회색 줄이 보여서 그리지 않음 -->
        <li th:each="e : ${entries}" class="note">
            <p class="note-meta"><a th:href="${paths.blog(e.handle())}" th:text="${e.handle()}">아이디</a>
                · <span th:text="${entryDates.get(e.id())}">방금</span>
                <span th:if="${e.secret()}"> · <svg th:replace="~{fragments/icons :: lock}"></svg> 비밀글</span></p>
            <p th:if="${e.visible()}" class="note-content" th:text="${e.content()}">인사</p>
            <p th:unless="${e.visible()}" class="note-content help">비밀글이에요</p>
            <form th:if="${e.deletable()}" method="post" th:action="${paths.blog(owner.handle()) + '/guestbook/' + e.id() + '/delete'}" class="inline-form">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-text">지우기</button>
            </form>
        </li>
    </ul>
    <p th:if="${nextBefore != null}"><a class="more-button" th:href="@{${paths.blog(owner.handle()) + '/guestbook'}(before=${nextBefore})}">더 보기</a></p>
</main>
</body>
</html>
