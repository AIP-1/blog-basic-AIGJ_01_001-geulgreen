<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <!-- 024: 그리기 전에 테마를 정한다(외부 파일, defer 없음) -->
    <script th:src="@{/js/theme-init.js}"></script>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_parameter" th:if="${_csrf != null}" th:content="${_csrf.parameterName}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:replace="${title}">글그린</title>
    <th:block th:if="${pageMeta != null}">
        <meta name="description" th:content="${pageMeta.description()}">
        <link rel="canonical" th:href="${pageMeta.canonicalUrl()}">
        <meta property="og:type" content="article">
        <meta property="og:title" th:content="${pageMeta.title()}">
        <meta property="og:description" th:content="${pageMeta.description()}">
        <meta property="og:url" th:content="${pageMeta.canonicalUrl()}">
        <meta property="og:image" th:content="${pageMeta.imageUrl()}">
        <meta property="article:published_time" th:content="${pageMeta.publishedTime()}">
        <meta property="article:modified_time" th:if="${pageMeta.modifiedTime() != null}" th:content="${pageMeta.modifiedTime()}">
    </th:block>
    <meta name="robots" content="noindex" th:if="${pageNoindex != null and pageNoindex}">
    <th:block th:if="${notFoundPage != null and notFoundPage}">
        <meta property="og:title" content="볼 수 없는 글이에요">
        <meta property="og:description" content="친구 공개·비공개 글이거나 삭제된 글입니다.">
        <meta name="robots" content="noindex">
    </th:block>
    <link rel="stylesheet" href="/fonts/pretendard/pretendard.css">
    <link rel="stylesheet" href="/fonts/gaegu/gaegu.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand" aria-label="글그린 처음으로"><th:block th:replace="~{fragments/icons :: paw}"></th:block><span>글그린</span></a>
    <nav class="site-nav" aria-label="주요 메뉴">
        <!-- 좁은 화면에서는 ☰ 안으로 접힌다(스크립트가 없으면 지금처럼 모두 펼친다) -->
        <div id="site-menu" class="site-menu">
            <div class="menu-main">
                <a href="/" th:attr="aria-current=${currentPath == '/' ? 'page' : null}">홈</a>
                <a href="/tags" th:attr="aria-current=${currentPath != null and currentPath.startsWith('/tags') ? 'page' : null}">태그</a>
                <a href="/missions" th:if="${missionsEnabled != null and missionsEnabled}"
                   th:attr="aria-current=${currentPath != null and currentPath.startsWith('/missions') ? 'page' : null}">미션</a>
                <th:block th:if="${currentMemberId != null}">
                    <a href="/feed" th:attr="aria-current=${currentPath == '/feed' ? 'page' : null}">피드</a>
                    <a href="/manage/posts" th:attr="aria-current=${currentPath != null and currentPath.startsWith('/manage') ? 'page' : null}">내 글</a>
                    <a href="/settings" th:attr="aria-current=${currentPath != null and currentPath.startsWith('/settings') ? 'page' : null}">설정</a>
                    <a href="/admin" th:if="${currentIsAdmin}" th:attr="aria-current=${currentPath != null and currentPath.startsWith('/admin') ? 'page' : null}">관리</a>
                </th:block>
            </div>
            <div class="menu-account">
                <th:block th:if="${currentMemberId != null}">
                    <form method="post" action="/write">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-primary btn-sm btn-write"><th:block th:replace="~{fragments/icons :: pen}"></th:block>새 글</button>
                    </form>
                </th:block>
                <th:block th:unless="${currentMemberId != null}">
                    <a href="/login" class="menu-login">로그인</a>
                    <a href="/signup" class="btn btn-primary btn-sm">가입하기</a>
                </th:block>
            </div>
        </div>
        <!-- 항상 보이는 것: 검색, 알림 종, 좁은 화면의 메뉴 버튼(테마 전환은 061부터 설정 화면에) -->
        <span class="header-quick">
            <a href="/search" class="icon-btn" aria-label="검색"><th:block th:replace="~{fragments/icons :: search}"></th:block></a>
            <span class="notif-bell-wrap" th:if="${currentMemberId != null}">
                <a href="/notifications" id="notif-bell" class="notif-bell" aria-label="알림"
                   aria-haspopup="true" aria-expanded="false"><th:block th:replace="~{fragments/icons :: bell}"></th:block><span id="notif-badge" class="notif-badge" hidden></span></a>
                <div id="notif-panel" class="notif-panel" hidden></div>
            </span>
            <!-- 홈 리뉴얼(강성찬 개인 확장): 내 프로필 메뉴(스크립트 없이 details) -->
            <details class="profile-menu" th:if="${currentMemberId != null}">
                <summary aria-label="내 메뉴">
                    <th:block th:if="${currentAvatar != null}"><th:block th:replace="~{fragments/avatar :: avatar(${currentAvatar}, 32)}"></th:block></th:block>
                    <span th:if="${currentAvatar == null}" class="avatar avatar-default" aria-hidden="true">나</span>
                </summary>
                <div class="profile-menu-panel">
                    <a th:if="${currentAvatar != null}" th:href="${'/@' + currentAvatar.handle()}" th:text="${currentAvatar.nickname() + '의 블로그'}">내 블로그</a>
                    <a href="/manage/posts">내 글 관리</a>
                    <a href="/manage/stats">통계</a>
                    <a href="/settings">설정</a>
                    <form method="post" action="/logout" data-logout-form th:attr="data-member-id=${currentMemberId}">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn-text">로그아웃</button>
                    </form>
                </div>
            </details>
            <button type="button" id="menu-toggle" class="menu-toggle" hidden aria-expanded="false" aria-controls="site-menu"
                    aria-label="메뉴 열기">☰</button>
        </span>
    </nav>
  </div>
</header>
<!-- 049 강성찬 개인 확장: 사이트 공지 띠 -->
<div th:if="${siteNotice != null}" class="site-notice" role="status">
    <span th:text="${'📢 ' + siteNotice.message()}">공지</span>
    <a th:if="${siteNotice.linkUrl() != null}" th:href="${siteNotice.linkUrl()}">자세히</a>
</div>
<div hidden id="logout-cleanup" th:if="${logoutCleanupMemberId != null}" th:attr="data-member-id=${logoutCleanupMemberId}"></div>
<main th:replace="${content}">
</main>
<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-brand"><th:block th:replace="~{fragments/icons :: paw}"></th:block><span>글그린</span></p>
    <p class="footer-slogan">좋은 글이 머무는 곳, 글그린</p>
    <p class="footer-links"><a href="/terms">이용약관</a> <a href="/privacy">개인정보 처리방침</a> <a href="/releases">릴리스 노트</a>
        <a th:if="${contactEmail != null}" th:href="${'mailto:' + contactEmail}">문의하기</a></p>
  </div>
  <!-- 꼬리말 아래 작은 정원(장식, 강성찬 개인 확장 시안): 언덕 두 겹 + 양 끝 풀숲과 꽃 -->
  <div class="footer-garden" aria-hidden="true">
    <svg class="garden-defs" width="0" height="0" focusable="false">
      <symbol id="gd-leafy" viewBox="0 0 40 64">
        <path class="gd-stem" d="M20 64C20 48 19 30 21 10"/>
        <path class="gd-leaf" d="M20 50c-8 1-14-3-15-10 7-1 13 2 15 10zM20 40c7 0 12-4 13-11-7 0-12 4-13 11zM20 30c-6 0-10-3-11-9 6 0 10 3 11 9zM21 20c5-1 8-4 8-9-5 1-8 4-8 9z"/>
      </symbol>
      <symbol id="gd-flower" viewBox="0 0 40 64">
        <path class="gd-stem" d="M20 64V24"/>
        <path class="gd-leaf" d="M20 48c-7 0-11-4-12-10 6 0 11 4 12 10zM20 42c6-1 10-5 10-11-6 1-10 5-10 11z"/>
        <g class="gd-petals"><circle cx="20" cy="9" r="5"/><circle cx="26.7" cy="13.8" r="5"/><circle cx="24.1" cy="21.6" r="5"/><circle cx="15.9" cy="21.6" r="5"/><circle cx="13.3" cy="13.8" r="5"/></g>
        <circle class="gd-core" cx="20" cy="16" r="3.6"/>
      </symbol>
      <symbol id="gd-grass" viewBox="0 0 40 30">
        <path class="gd-stem" d="M20 30c0-9-2-16-6-22M20 30c0-10 2-17 7-24M20 30c0-6-4-11-10-14M20 30c0-6 5-11 11-13"/>
      </symbol>
    </svg>
    <svg class="garden-hills" viewBox="0 0 1200 80" preserveAspectRatio="none" focusable="false">
      <path class="hill-back" d="M0 80V46c90-18 210-26 330-14s210 22 320 10 250-30 360-18c80 9 140 18 190 26V80z"/>
      <path class="hill-front" d="M0 80V62c150-14 300-16 450-6s330 12 480 0c110-8 200-6 270 2V80z"/>
    </svg>
    <svg class="gp leafy p1" focusable="false"><use href="#gd-leafy"/></svg>
    <svg class="gp flower p2" focusable="false"><use href="#gd-flower"/></svg>
    <svg class="gp leafy p3" focusable="false"><use href="#gd-leafy"/></svg>
    <svg class="gp flower pink p4" focusable="false"><use href="#gd-flower"/></svg>
    <svg class="gp tuft p5" focusable="false"><use href="#gd-grass"/></svg>
    <svg class="gp tuft p6" focusable="false"><use href="#gd-grass"/></svg>
    <svg class="gp flower p7" focusable="false"><use href="#gd-flower"/></svg>
    <svg class="gp leafy p8" focusable="false"><use href="#gd-leafy"/></svg>
    <svg class="gp flower pink p9" focusable="false"><use href="#gd-flower"/></svg>
    <svg class="gp leafy p10" focusable="false"><use href="#gd-leafy"/></svg>
    <svg class="gp leafy p11" focusable="false"><use href="#gd-leafy"/></svg>
  </div>
</footer>
<script th:src="@{/js/auth/auth-logout.js}" defer></script>
<script th:src="@{/js/menu.js}" defer></script>
<script th:if="${currentMemberId != null}" th:src="@{/js/notification/bell.js}" defer></script>
</body>
</html>
