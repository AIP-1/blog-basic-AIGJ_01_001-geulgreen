<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>내 글 · 글그린</title>
</head>
<body>
<main id="manage" class="list-page" th:attr="data-tab=${tab},data-visibility=${visibility}">
    <div class="manage-head">
        <h1>내 글</h1>
        <form method="post" action="/write">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">새 글</button>
        </form>
    </div>
    <!-- 세 탭(011 FR-002·FR-006). 063 강성찬 개인 확장: 발행 글이 먼저·기본 -->
    <nav class="manage-tabs" aria-label="내 글 탭">
        <a data-count-tab="published" data-count-label="발행 글" th:href="@{/manage/posts(tab='published')}" th:attr="aria-current=${tab == 'published' ? 'page' : null}"
           th:text="${'발행 글 ' + counts.get('published')}">발행 글 0</a>
        <a data-count-tab="drafts" data-count-label="임시글" th:href="@{/manage/posts(tab='drafts')}" th:attr="aria-current=${tab == 'drafts' ? 'page' : null}"
           th:text="${'임시글 ' + counts.get('drafts')}">임시글 0</a>
        <a data-count-tab="trash" data-count-label="휴지통" th:href="@{/manage/posts(tab='trash')}" th:attr="aria-current=${tab == 'trash' ? 'page' : null}"
           th:text="${'휴지통 ' + counts.get('trash')}">휴지통 0</a>
        <!-- 032 강성찬 개인 확장: 작성자 통계 -->
        <a href="/manage/stats">통계</a>
    </nav>
    <nav th:if="${tab == 'published'}" class="manage-filter" aria-label="공개 범위 필터">
        <a th:href="@{/manage/posts(tab='published')}" th:attr="aria-current=${visibility == '' ? 'page' : null}">전체</a>
        <a th:href="@{/manage/posts(tab='published',visibility='public')}" th:attr="aria-current=${visibility == 'public' ? 'page' : null}">공개</a>
        <a th:href="@{/manage/posts(tab='published',visibility='friends')}" th:attr="aria-current=${visibility == 'friends' ? 'page' : null}">친구 공개</a>
        <a th:href="@{/manage/posts(tab='published',visibility='link')}" th:attr="aria-current=${visibility == 'link' ? 'page' : null}">링크 공개</a>
        <a th:href="@{/manage/posts(tab='published',visibility='private')}" th:attr="aria-current=${visibility == 'private' ? 'page' : null}">비공개</a>
    </nav>
    <p th:if="${tab == 'trash'}" class="notice">휴지통의 글은 30일 뒤 자동으로 완전히 삭제돼요</p>
    <form th:if="${tab == 'trash' and counts.get('trash') > 0}" method="post" action="/manage/posts/trash/empty"
          class="trash-empty" th:attr="data-confirm=${'휴지통의 글 ' + counts.get('trash') + '개를 영구 삭제합니다. 되돌릴 수 없어요.'}">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <!-- 스크립트가 없으면 확인창 대신 꼭 체크해야 하는 확인 -->
        <noscript><label><input type="checkbox" required> <span th:text="${'글 ' + counts.get('trash') + '개를 영구 삭제해요. 되돌릴 수 없어요.'}">확인</span></label></noscript>
        <button type="submit" class="btn btn-danger btn-sm">휴지통 비우기</button>
    </form>
    <p th:if="${continued}"><a class="link-btn" th:href="@{/manage/posts(tab=${tab})}">처음부터 보기</a></p>
    <p th:if="${rows.isEmpty()}" class="help">아직 글이 없어요.</p>

    <!-- 067 후속(강성찬 개인 확장): 홈과 같은 카드 조각, 관리 정보는 배지, 관리 버튼은 ⋯ 메뉴 -->
    <ul class="post-rows card-grid home-cards" id="post-rows">
        <li th:each="row : ${rows}" class="post-row" th:attr="data-post-id=${row.id()}">
            <article th:replace="~{fragments/post-card :: cardWith(${cards.get(row.id())}, ${cardLabels.get(row.id())}, false, ~{post/manage :: manageExtra})}"></article>
            <p class="row-error field-error" role="alert" hidden></p>
        </li>
    </ul>
    <p class="list-more"><a th:if="${nextCursor != null}" class="more-button" th:attr="data-cursor=${nextCursor}"
          th:href="@{/manage/posts(tab=${tab},visibility=${visibility},cursor=${nextCursor})}">더 보기</a></p>
    <p id="manage-notice" class="notice" role="status" data-toast th:hidden="${manageNotice == null}" th:text="${manageNotice}"></p>
    <script th:src="@{/js/post/manage.js}" defer></script>
</main>

<!-- 카드에 덧붙는 관리 부분(row·tab은 부르는 쪽 값) -->
<th:block th:fragment="manageExtra">
    <p class="manage-badges">
        <th:block th:if="${tab == 'drafts'}">
            <span class="badge">임시글</span>
            <span class="badge" th:if="${scheduleLabels != null and scheduleLabels.containsKey(row.id())}"
                  th:text="${'⏰ 예약 · ' + scheduleLabels.get(row.id())}">예약</span>
        </th:block>
        <th:block th:if="${tab == 'published'}">
            <span th:replace="~{fragments/visibility :: badge(${row.visibility()})}"></span>
            <span class="badge badge-editing" th:if="${row.editing()}">수정 중</span>
            <span class="badge" th:if="${row.hidden()}" title="운영 정책에 따라 숨겨졌어요">숨김</span>
            <span class="badge" th:text="${'조회 ' + views.get(row.id())}">조회</span>
        </th:block>
        <th:block th:if="${tab == 'trash'}">
            <span class="badge" th:text="${row.status().name() == 'DRAFT' ? '임시글' : '발행 글'}">발행 글</span>
            <span class="badge" th:text="${daysLeft.get(row.id()) == 0 ? '오늘 삭제' : daysLeft.get(row.id()) + '일 남음'}">29일 남음</span>
        </th:block>
    </p>
    <details class="sort-menu manage-menu">
        <summary aria-label="글 관리">⋯</summary>
        <div class="sort-menu-panel">
            <a th:if="${tab == 'drafts'}" th:href="@{/write/{id}(id=${row.id()})}">이어 쓰기</a>
            <th:block th:if="${tab == 'published'}">
                <a th:href="@{/write/{id}(id=${row.id()})}" th:text="${row.editing() ? '이어서 수정' : '수정'}">수정</a>
                <button type="button" th:if="${row.editing()}" class="discard-editing" th:attr="data-post-id=${row.id()}">변경 취소</button>
                <button type="button" class="visibility-toggle" th:attr="data-post-id=${row.id()},data-visibility=${row.visibility()}"
                        th:text="${row.visibility() != 'PUBLIC' ? '전체 공개로' : '나만 보기로'}">나만 보기로</button>
            </th:block>
            <form th:if="${tab != 'trash'}" method="post" th:action="@{/manage/posts/{id}/trash(id=${row.id()},tab=${tab})}" data-row-action="trash">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="menu-danger">삭제</button>
            </form>
            <th:block th:if="${tab == 'trash'}">
                <form method="post" th:action="@{/manage/posts/{id}/restore(id=${row.id()},tab=${tab})}" data-row-action="restore">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit">복구</button>
                </form>
                <form method="post" th:action="@{/manage/posts/{id}/purge(id=${row.id()},tab=${tab})}" data-row-action="purge">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="menu-danger">영구 삭제</button>
                </form>
            </th:block>
        </div>
    </details>
</th:block>
</body>
</html>
