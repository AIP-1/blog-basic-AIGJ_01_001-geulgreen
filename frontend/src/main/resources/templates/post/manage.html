<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>내 글 · 글그린</title>
</head>
<body>
<main id="manage" class="list-page" th:attr="data-tab=${tab},data-visibility=${visibility},data-page=${currentPage}">
    <div class="manage-head">
        <h1>내 글</h1>
    </div>
    <!-- 세 탭(011 FR-002·FR-006). 063 강성찬 개인 확장: 발행 글이 먼저·기본 -->
    <nav class="manage-tabs" aria-label="내 글 탭">
        <a data-count-tab="published" data-count-label="발행 글" th:href="@{/manage/posts(tab='published')}" th:attr="aria-current=${tab == 'published' ? 'page' : null}"
           th:text="${'발행 글 ' + counts.get('published')}">발행 글 0</a>
        <a data-count-tab="drafts" data-count-label="임시글" th:href="@{/manage/posts(tab='drafts')}" th:attr="aria-current=${tab == 'drafts' ? 'page' : null}"
           th:text="${'임시글 ' + counts.get('drafts')}">임시글 0</a>
        <a data-count-tab="trash" data-count-label="휴지통" th:href="@{/manage/posts(tab='trash')}" th:attr="aria-current=${tab == 'trash' ? 'page' : null}"
           th:text="${'휴지통 ' + counts.get('trash')}">휴지통 0</a>
        <!-- 106 강성찬 개인 확장: 시리즈 만들기·넣기·순서 -->
        <a th:if="${seriesEnabled}" href="/manage/series">시리즈</a>
        <!-- 032 강성찬 개인 확장: 작성자 통계 -->
        <a href="/manage/stats">통계</a>
    </nav>
    <nav th:if="${tab == 'published'}" class="manage-filter" aria-label="공개 범위 필터">
        <a th:href="@{/manage/posts(tab='published')}" th:attr="aria-current=${visibility == '' ? 'page' : null}">전체</a>
        <a th:href="@{/manage/posts(tab='published',visibility='public')}" th:attr="aria-current=${visibility == 'public' ? 'page' : null}">공개</a>
        <a th:href="@{/manage/posts(tab='published',visibility='friends')}" th:attr="aria-current=${visibility == 'friends' ? 'page' : null}">친한 친구만</a>
        <a th:href="@{/manage/posts(tab='published',visibility='link')}" th:attr="aria-current=${visibility == 'link' ? 'page' : null}">링크 공개</a>
        <a th:href="@{/manage/posts(tab='published',visibility='private')}" th:attr="aria-current=${visibility == 'private' ? 'page' : null}">비공개</a>
    </nav>
    <p th:if="${tab == 'trash'}" class="notice">휴지통의 글은 30일 뒤 자동으로 완전히 삭제돼요</p>
    <form th:if="${tab == 'trash' and counts.get('trash') > 0}" method="post" action="/manage/posts/trash/empty"
          class="trash-empty" th:attr="data-confirm=${'휴지통의 글 ' + counts.get('trash') + '개를 영구 삭제합니다. 되돌릴 수 없어요.'}">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <!-- 스크립트가 없으면 확인창 대신 꼭 체크해야 하는 확인 -->
        <noscript><label><input type="checkbox" required> <span th:text="${'글 ' + counts.get('trash') + '개를 영구 삭제해요. 되돌릴 수 없어요.'}">확인</span></label></noscript>
        <button type="submit" class="btn btn-danger btn-sm">휴지통 비우기</button>
    </form>
    <p th:if="${rows.isEmpty()}" class="help">아직 글이 없어요.</p>

    <!-- 101 강성찬 개인 확장: 한 글 한 줄(제목 · 태그·공개 범위·배지 · 조회·좋아요·댓글 · 날짜 · ⋯ 메뉴). 휴대폰은 두 줄.
         067의 카드는 같은 줄 카드 높이를 맞추느라(card-rows.js) 짧은 글 카드 아래가 비어 보였다 -->
    <!-- 109 강성찬 개인 확장: 여러 글 골라 한 번에(발행 글·임시글: 휴지통으로·공개 범위, 휴지통: 복원·영구 삭제).
         글마다 쓰는 API를 차례로 부른다. 스크립트가 켜져야 보인다(manage.js가 hidden을 푼다) -->
    <span id="list-top" class="list-anchor"></span>
    <div class="bulk-bar" th:unless="${rows.isEmpty()}" hidden>
        <label class="bulk-all"><input type="checkbox" data-bulk-all> 전체 선택</label>
        <span class="bulk-count" role="status" aria-live="polite"></span>
        <span class="bulk-actions" hidden>
            <th:block th:unless="${tab == 'trash'}">
                <details th:if="${tab == 'published'}" class="sort-menu bulk-visibility">
                    <summary>공개 범위 바꾸기</summary>
                    <div class="sort-menu-panel">
                        <button type="button" th:each="o : ${ {'PUBLIC','FRIENDS','LINK','GROUP','PRIVATE'} }" th:attr="data-bulk-visibility=${o}"
                                th:text="${o == 'PRIVATE' ? '나만 보기' : (o == 'FRIENDS' ? '친한 친구만' : (o == 'LINK' ? '링크 공개' : (o == 'GROUP' ? '그룹 공개' : '전체 공개')))}">전체 공개</button>
                    </div>
                </details>
                <button type="button" class="btn btn-sm btn-danger" data-bulk-action="trash"><svg th:replace="~{fragments/icons :: trash}"></svg>휴지통으로</button>
                <!-- 113 후속: 임시글은 고른 글을 저장된 발행 설정(공개 범위·태그)으로 한 번에 발행 -->
                <button type="button" th:if="${tab == 'drafts'}" class="btn btn-sm btn-primary" data-bulk-publish><svg th:replace="~{fragments/icons :: share}"></svg>선택한 글 발행</button>
            </th:block>
            <th:block th:if="${tab == 'trash'}">
                <button type="button" class="btn btn-sm" data-bulk-action="restore"><svg th:replace="~{fragments/icons :: restore}"></svg>복원</button>
                <button type="button" class="btn btn-sm btn-danger" data-bulk-action="purge"><svg th:replace="~{fragments/icons :: trash}"></svg>영구 삭제</button>
            </th:block>
        </span>
    </div>
    <ul class="manage-list" id="post-rows">
        <li th:each="row : ${rows}" class="post-row" th:with="card=${cards.get(row.id())}" th:attr="data-post-id=${row.id()}">
            <!-- 102: 오른쪽은 줄마다 같은 칸(태그 · 조회 · 좋아요 · 댓글 · 날짜 · ⋯). 태그가 없어도 칸은 남는다 -->
            <div class="manage-row">
                <div class="manage-row-main">
                    <input type="checkbox" class="row-check" th:attr="aria-label=${'선택: ' + card.title()}">
                    <a class="manage-row-title" th:href="${tab == 'drafts' ? '/write/' + row.id() : card.url()}"
                       th:text="${#strings.isEmpty(row.title()) and !#strings.isEmpty(card.excerpt()) ? card.excerpt() : card.title()}" th:title="${card.title()}">제목</a>
                    <th:block th:replace="~{post/manage :: manageBadges}"></th:block>
                </div>
                <span class="manage-row-tag"><a th:if="${card.firstTag() != null}" class="card-tag"
                   th:href="@{/tags/{name}(name=${card.firstTag()})}" th:text="${card.firstTag()}" th:title="${card.firstTag()}">태그</a></span>
                <span class="manage-num" th:if="${tab == 'published'}" th:attr="aria-label=${'조회 ' + views.get(row.id())}"><svg th:replace="~{fragments/icons :: eye}"></svg><span th:text="${views.get(row.id())}">0</span></span>
                <span class="manage-num" th:unless="${tab == 'published'}"></span>
                <span class="manage-num" th:attr="aria-label=${'좋아요 ' + card.likeCount()}"><svg th:replace="~{fragments/icons :: heart}"></svg><span th:text="${card.likeCount()}">0</span></span>
                <span class="manage-num" th:attr="aria-label=${'댓글 ' + card.commentCount()}"><svg th:replace="~{fragments/icons :: comment}"></svg><span th:text="${card.commentCount()}">0</span></span>
                <time class="manage-row-date" th:attr="datetime=${card.firstPublicAt()}" th:title="${cardLabels.get(row.id())}" th:text="${rowDates.get(row.id())}">2026.10.15</time>
                <th:block th:replace="~{post/manage :: manageMenu}"></th:block>
            </div>
            <p class="row-error field-error" role="alert" hidden></p>
        </li>
    </ul>
    <!-- 113 강성찬 개인 확장: [더 보기] 대신 쪽 번호. 처음·끝 쪽과 지금 쪽 앞뒤 2쪽(휴대폰은 앞뒤 1쪽), 사이는 …. 옮기면 목록 시작으로(#list-top) -->
    <nav class="pager" th:if="${totalPages > 1}" aria-label="쪽 번호"
         th:with="vis=${visibility == '' ? null : visibility}">
        <a th:if="${currentPage > 1}" class="pager-step" th:href="@{/manage/posts(tab=${tab},visibility=${vis},page=${currentPage - 1})} + '#list-top'"
           aria-label="이전 쪽"><svg th:replace="~{fragments/icons :: chevron-left}"></svg></a>
        <span th:unless="${currentPage > 1}" class="pager-step is-off" aria-hidden="true"><svg th:replace="~{fragments/icons :: chevron-left}"></svg></span>
        <th:block th:each="n : ${#numbers.sequence(1, totalPages)}"
                  th:with="near=${n == 1 or n == totalPages or (n >= currentPage - 2 and n <= currentPage + 2)},
                           close=${n == 1 or n == totalPages or (n >= currentPage - 1 and n <= currentPage + 1)}">
            <a th:if="${near and n != currentPage}" th:href="@{/manage/posts(tab=${tab},visibility=${vis},page=${n})} + '#list-top'"
               th:class="${close ? 'pager-num' : 'pager-num pager-far'}" th:text="${n}">2</a>
            <span th:if="${n == currentPage}" class="pager-num is-current" aria-current="page" th:text="${n}">1</span>
            <span th:if="${(n == 2 and currentPage - 2 > 2) or (n == totalPages - 1 and currentPage + 2 < totalPages - 1)}" class="pager-gap" aria-hidden="true">…</span>
        </th:block>
        <a th:if="${currentPage < totalPages}" class="pager-step" th:href="@{/manage/posts(tab=${tab},visibility=${vis},page=${currentPage + 1})} + '#list-top'"
           aria-label="다음 쪽"><svg th:replace="~{fragments/icons :: chevron}"></svg></a>
        <span th:unless="${currentPage < totalPages}" class="pager-step is-off" aria-hidden="true"><svg th:replace="~{fragments/icons :: chevron}"></svg></span>
    </nav>
    <p id="manage-notice" class="notice" role="status" data-toast="success" th:hidden="${manageNotice == null}" th:text="${manageNotice}"></p>
    <script th:src="@{/js/post/visibility-menu.js}" defer></script>
    <script th:src="@{/js/post/manage.js}" defer></script>
</main>

<!-- 카드에 덧붙는 관리 부분(row·tab은 부르는 쪽 값) -->
<p th:fragment="manageBadges" class="manage-badges">
        <th:block th:if="${tab == 'drafts'}">
            <span class="badge">임시글</span>
            <span class="badge" th:if="${scheduleLabels != null and scheduleLabels.containsKey(row.id())}"
                  th:text="${'⏰ 예약 · ' + scheduleLabels.get(row.id())}">예약</span>
        </th:block>
        <th:block th:if="${tab == 'published'}">
            <span th:replace="~{fragments/visibility :: badge(${row.visibility()})}"></span>
            <span class="badge badge-editing" th:if="${row.editing()}">수정 중</span>
            <span class="badge" th:if="${row.hidden()}" title="운영 정책에 따라 숨겨졌어요">숨김</span>
        </th:block>
        <th:block th:if="${tab == 'trash'}">
            <span class="badge" th:text="${row.status().name() == 'DRAFT' ? '임시글' : '발행 글'}">발행 글</span>
            <span class="badge" th:text="${daysLeft.get(row.id()) == 0 ? '오늘 삭제' : daysLeft.get(row.id()) + '일 남음'}">29일 남음</span>
        </th:block>
</p>
<details th:fragment="manageMenu" class="sort-menu manage-menu">
        <summary aria-label="글 관리">⋯</summary>
        <div class="sort-menu-panel">
            <!-- 098 강성찬 개인 확장: 글 화면 ⋯ 메뉴와 같은 줄 모양(선 아이콘, 공개 범위는 그 자리에서 펼침) -->
            <a th:if="${tab == 'drafts'}" th:href="@{/write/{id}(id=${row.id()})}"><svg th:replace="~{fragments/icons :: pen}"></svg>이어 쓰기</a>
            <th:block th:if="${tab == 'published'}">
                <a th:href="@{/write/{id}(id=${row.id()})}"><svg th:replace="~{fragments/icons :: pen}"></svg><span th:text="${row.editing() ? '이어서 수정' : '수정'}">수정</span></a>
                <button type="button" th:if="${row.editing()}" class="discard-editing" th:attr="data-post-id=${row.id()}"><svg th:replace="~{fragments/icons :: restore}"></svg>변경 취소</button>
                <details th:replace="~{fragments/owner-menu :: visibility(${row.id()}, ${row.visibility()})}"></details>
            </th:block>
            <form th:if="${tab != 'trash'}" method="post" th:action="@{/manage/posts/{id}/trash(id=${row.id()},tab=${tab})}" data-row-action="trash">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="menu-danger"><svg th:replace="~{fragments/icons :: trash}"></svg>삭제</button>
            </form>
            <th:block th:if="${tab == 'trash'}">
                <form method="post" th:action="@{/manage/posts/{id}/restore(id=${row.id()},tab=${tab})}" data-row-action="restore">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"><svg th:replace="~{fragments/icons :: restore}"></svg>복구</button>
                </form>
                <form method="post" th:action="@{/manage/posts/{id}/purge(id=${row.id()},tab=${tab})}" data-row-action="purge">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="menu-danger"><svg th:replace="~{fragments/icons :: trash}"></svg>영구 삭제</button>
                </form>
            </th:block>
        </div>
    </details>
</body>
</html>
