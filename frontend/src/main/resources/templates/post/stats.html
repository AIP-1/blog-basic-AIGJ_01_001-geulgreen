<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>통계 · 글그린</title>
</head>
<body>
<main class="stats-page">
    <h1>통계</h1>
    <p class="help">나만 볼 수 있어요. 조회수는 같은 사람의 반복 방문·내 방문·검색 로봇을 빼고 센 값이에요. <a href="/manage/posts">내 글로</a></p>
    <ul class="stats-totals">
        <li><span class="stats-number" th:text="${stats.totals().posts()}">0</span><span>발행 글</span></li>
        <li><span class="stats-number" th:text="${stats.totals().views()}">0</span><span>전체 조회</span></li>
        <li><span class="stats-number" th:text="${stats.totals().likes()}">0</span><span>좋아요</span></li>
        <li><span class="stats-number" th:text="${stats.totals().comments()}">0</span><span>댓글</span></li>
        <li><span class="stats-number" th:text="${stats.totals().followers()}">0</span><span>팔로워</span></li>
    </ul>

    <section aria-labelledby="days-heading" class="stats-card">
        <h2 id="days-heading" th:text="${'최근 30일 조회 ' + stats.recentViews()}">최근 30일 조회 0</h2>
        <!-- 101·102 강성찬 개인 확장: 막대에 마우스를 올리거나 누르면(휴대폰은 탭) 날짜와 조회 수가 뜬다. 낭독기는 아래 숨은 표를 읽는다 -->
        <div class="stats-bars" aria-hidden="true">
            <span th:each="d : ${stats.days()}" class="stats-bar" tabindex="-1">
                <span class="stats-bar-fill" th:style="${'height:' + d.percent() + '%'}"></span>
                <span class="stats-tip" aria-hidden="true" th:text="${d.label() + ' · ' + d.views() + '회'}">10.9 · 0회</span>
            </span>
        </div>
        <div class="stats-axis" aria-hidden="true">
            <span th:text="${stats.days()[0].label()}">9.10</span><span th:text="${stats.days()[stats.days().size() - 1].label()}">10.9</span>
        </div>
        <!-- 102: 보이는 "날짜별 숫자 보기"는 뺐다(막대를 올리거나 누르면 숫자가 뜸). 화면 낭독기용 표만 남긴다 -->
        <div class="visually-hidden"><table class="stats-table">
            <caption>최근 30일 날짜별 조회</caption>
            <thead><tr><th scope="col">날짜</th><th scope="col">조회</th></tr></thead>
            <tbody><tr th:each="i : ${#numbers.sequence(stats.days().size() - 1, 0, -1)}" th:with="d=${stats.days()[i]}">
                <td th:text="${d.label()}">10.9</td><td th:text="${d.views()}">0</td></tr></tbody>
        </table></div>
    </section>

    <section aria-labelledby="top-heading" class="stats-card">
        <h2 id="top-heading">30일 동안 많이 읽힌 글</h2>
        <p th:if="${stats.top().isEmpty()}" class="help">아직 집계된 조회가 없어요</p>
        <!-- 101: 순위 칸 · 제목(한 줄) · 1위 대비 막대와 조회 수 -->
        <ol class="stats-top" th:unless="${stats.top().isEmpty()}" th:with="max=${stats.top()[0].views() > 0 ? stats.top()[0].views() : 1}">
            <li th:each="p, st : ${stats.top()}">
                <span class="stats-rank" th:classappend="${st.first} ? 'is-first'" th:text="${st.count}">1</span>
                <a class="stats-top-title" th:href="${p.url()}" th:text="${p.title()}" th:title="${p.title()}">제목</a>
                <span class="stats-top-views"><span class="stats-top-bar" aria-hidden="true"><span th:style="${'width:' + (p.views() * 100 / max) + '%'}"></span></span>
                    <span th:text="${p.views() + '회'}">0회</span></span>
            </li>
        </ol>
    </section>
</main>
</body>
</html>
