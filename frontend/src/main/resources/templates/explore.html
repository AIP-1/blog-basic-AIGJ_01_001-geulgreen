<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>탐색 - 글그린</title>
</head>
<body>
<!-- 079 강성찬 개인 확장: 탐색. 086: 피드 형식(추천 블로그 줄 + 추천 글 카드 목록)으로 추천을 한곳에 -->
<main class="list-page explore-page">
    <h1>탐색</h1>
    <p th:if="${continued}"><a href="/explore">처음부터 보기</a></p>
    <ul th:if="${!popularTags.isEmpty()}" class="tag-pills side-pills" aria-label="인기 태그">
        <li th:each="t : ${popularTags}"><a th:replace="~{fragments/tag-pill :: pill(${t.name()}, ${t.postCount()}, ${tagStyles.get(t.name())})}"></a></li>
    </ul>
    <section th:if="${!recommended.isEmpty()}" class="feed-recommended" aria-labelledby="explore-rec-heading">
        <h2 id="explore-rec-heading">추천 블로그 <span class="help">아직 팔로우하지 않은 블로그예요</span></h2>
        <ul class="recommended-list">
            <li th:each="b : ${recommended}" class="recommended-blog">
                <a th:href="${paths.blog(b.handle())}" class="newcomer-who">
                    <th:block th:replace="~{fragments/avatar :: avatar(${b.avatar()}, 36)}"></th:block>
                    <span th:text="${b.handle()}">아이디</span></a>
                <p class="help recommended-bio" th:if="${b.bio() != null}" th:text="${b.bio()}">소개</p>
                <th:block th:replace="~{fragments/follow :: button(${b.handle()}, false, ${currentMemberId != null}, '/login', '/explore')}"></th:block>
            </li>
        </ul>
        <p class="follow-message help" role="status" hidden></p>
    </section>
    <h2 class="explore-posts-heading">추천 글</h2>
    <div th:if="${cards.isEmpty() and !continued}" class="empty-state">아직 둘러볼 글이 없어요 <a href="/">홈으로</a></div>
    <div class="card-grid" id="card-grid">
        <th:block th:each="card : ${cards}">
            <article th:replace="~{fragments/post-card :: card(${card}, ${cardDates.get(card.id())}, true)}"></article>
        </th:block>
    </div>
    <div th:replace="~{fragments/post-card :: more(${nextCursor}, ${listApi}, true, ${!cards.isEmpty()})}"></div>
    <script th:src="@{/js/post/list-more.js}" defer></script>
    <script th:src="@{/js/follow/follow.js}" defer></script>
</main>
</body>
</html>
