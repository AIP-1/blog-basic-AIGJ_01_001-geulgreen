<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <title>연결이 끊겼어요 - 글그린</title>
    <!-- 앱 설치 서비스 워커(sw.js)가 미리 받아 두는 안내 화면. 색은 theme.css 토큰만 쓴다 -->
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: var(--color-bg); color: var(--color-text);
               font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
        main { max-width: 360px; padding: 24px; text-align: center; }
        img { width: 64px; height: 64px; }
        h1 { margin: 20px 0 8px; font-size: 22px; }
        p { margin: 0 0 24px; color: var(--color-text-muted); font-size: 16px; line-height: 1.6; }
        a { display: inline-block; min-height: 44px; padding: 0 24px; line-height: 44px; border-radius: 12px;
            background: var(--color-brand-fill); color: var(--color-on-fill); font-weight: 600; text-decoration: none; }
        a:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
    </style>
</head>
<body>
<main>
    <img src="/images/favicon.svg" alt="">
    <h1>연결이 끊겼어요</h1>
    <p>인터넷에 다시 연결되면<br>글그린을 이어서 볼 수 있어요.</p>
    <a href="/">다시 시도</a>
</main>
</body>
</html>
